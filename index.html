<!DOCTYPE html>
<html lang="en" data-theme="evening">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC21A">
<meta name="mobile-web-app-capable" content="yes">
<title>Momos BC Billing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --veg:#1E8E3E; --nonveg:#C62828; --yellow:#FFC21A; --ink:#151412;
  --radius-l:18px; --radius-m:12px; --radius-s:8px;
  font-family: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
html[data-theme="evening"]{
  --bg:#FFF6DA; --surface:#FFFFFF; --surface-2:#FFEFBF; --text:#1B1A17; --muted:#6E654F;
  --line:#E8D9A8; --head-bg:#FFC21A; --head-text:#151412; --badge-bg:#151412; --badge-text:#FFC21A;
  --bar-bg:#151412; --bar-text:#FFFFFF; --bar-accent:#FFC21A; --tab-on-bg:#151412; --tab-on-text:#FFC21A;
  --btn-bg:#151412; --btn-text:#FFC21A; --shadow:0 2px 0 #E2CF92;
  color-scheme: light;
}
html[data-theme="night"]{
  --bg:#0A0F1F; --surface:#161E36; --surface-2:#212B4B; --text:#F4EFE2; --muted:#A7AFC8;
  --line:#2C3759; --head-bg:#03050C; --head-text:#FFC21A; --badge-bg:#FFC21A; --badge-text:#151412;
  --bar-bg:#FFC21A; --bar-text:#151412; --bar-accent:#151412; --tab-on-bg:#FFC21A; --tab-on-text:#151412;
  --btn-bg:#FFC21A; --btn-text:#151412; --shadow:0 2px 0 #050813;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-size:17px;line-height:1.35;overscroll-behavior:none;touch-action:manipulation;
  padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid #2F7BFF;outline-offset:2px}
.hidden{display:none!important}
.dot{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-radius:3px;position:relative;flex:none;vertical-align:-2px}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.dot.v{color:var(--veg)} .dot.n{color:var(--nonveg)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--head-bg);color:var(--head-text);
  display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.brand{font-weight:900;font-style:italic;font-size:24px;letter-spacing:-.5px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;color:inherit;padding:4px 0;min-height:48px}
.brand small{display:block;font-size:13px;font-style:normal;font-weight:700;letter-spacing:0;opacity:.8;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
#sumBtn{position:relative}
.pend{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#D32F2F;color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;font-style:normal}
.menu-badge{display:flex;align-items:center;gap:8px;background:var(--badge-bg);color:var(--badge-text);
  border-radius:999px;padding:8px 14px 8px 10px;font-weight:800;font-size:17px;min-height:48px}
.menu-badge .ico{font-size:24px;line-height:1}
.menu-badge .chg{font-size:12px;font-weight:600;opacity:.8;display:block;line-height:1}
.icon-btn{min-width:48px;min-height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(127,127,127,.18);color:var(--head-text)}

.nudge{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#B3261E;color:#fff;font-weight:600}
.nudge span{flex:1}
.nudge button{background:#fff;color:#B3261E;border-radius:10px;padding:10px 14px;font-weight:800}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:48px;padding:0 18px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:16px;white-space:nowrap}
.tab.on{background:var(--tab-on-bg);color:var(--tab-on-text);border-color:var(--tab-on-bg)}

/* ---------- grid ---------- */
main{padding:12px 12px 120px}
.group-title{font-weight:800;font-size:15px;color:var(--muted);margin:14px 4px 8px}
.group-title:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.tile{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow);min-height:104px;display:flex}
.tile.has{border-color:var(--yellow);border-width:3px}
.tile-add{flex:1;text-align:left;padding:12px 12px 12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;border-radius:var(--radius-l)}
.tile-add:active{background:var(--surface-2)}
.tname{font-weight:800;font-size:17px;line-height:1.2;display:flex;gap:8px;align-items:flex-start}
.tname .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#151412;font-size:14px;display:grid;place-items:center;font-weight:900}
.tname .dot{margin-top:3px}
.tprice{font-weight:800;font-size:18px}
.tprice small{font-weight:600;font-size:13px;color:var(--muted)}
.tqty{position:absolute;top:-10px;right:-8px;min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--yellow);color:#151412;font-weight:900;font-size:17px;display:grid;place-items:center;border:3px solid var(--bg);pointer-events:none}
.tile-minus{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:26px;font-weight:800;line-height:1}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.bar button{width:100%;min-height:68px;border-radius:var(--radius-l);background:var(--bar-bg);color:var(--bar-text);display:flex;align-items:center;gap:12px;padding:0 18px;font-size:18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bar .cnt{background:var(--bar-accent);color:var(--bar-bg);border-radius:999px;padding:4px 12px;font-weight:900}
.bar .amt{flex:1;text-align:left;font-size:24px;font-weight:900}
.bar .go{font-weight:800}
.bar button:disabled{opacity:.55;justify-content:center;font-weight:600;font-size:16px}

/* ---------- layers ---------- */
.layer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.layer-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--head-bg);color:var(--head-text);min-height:68px}
.layer-head h2{margin:0;font-size:21px;font-weight:900;flex:1}
.back-btn{min-height:48px;padding:0 14px;border-radius:12px;background:rgba(127,127,127,.2);font-weight:800;color:var(--head-text)}
.layer-body{flex:1;overflow-y:auto;padding:14px 12px 24px}
.layer-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}

/* bill */
.bill-wrap{display:grid;gap:14px;max-width:1100px;margin:0 auto;grid-template-areas:"qr" "mobile" "items"}
.b-items{grid-area:items}.b-mobile{grid-area:mobile}.b-qr{grid-area:qr}
@media (min-width:820px){.bill-wrap{grid-template-columns:1.15fr 1fr;grid-template-areas:"items qr" "mobile qr";align-items:start}.b-qr{position:sticky;top:0}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-l);padding:14px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .ln{font-weight:700;display:flex;gap:8px;align-items:flex-start}
.line .ln .dot{margin-top:4px}
.line .la{font-weight:900;font-size:18px;text-align:right}
.line .lp{color:var(--muted);font-size:15px}
.stepper{display:flex;align-items:center;gap:6px;justify-self:end}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--surface-2);font-size:24px;font-weight:900}
.stepper b{min-width:30px;text-align:center;font-size:19px}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:12px;border-top:3px solid var(--text)}
.grand span{font-weight:800;font-size:18px}
.grand b{font-size:38px;font-weight:900;letter-spacing:-1px}
.qr-box{background:#fff;color:#151412;border-radius:var(--radius-l);padding:14px;text-align:center;border:4px solid var(--yellow)}
.qr-box .qr{width:min(62vw,260px);margin:0 auto}
@media (min-width:820px){.qr-box .qr{width:min(34vw,320px)}}
.qr-box .qr svg{width:100%;height:auto;display:block}
.qr-box .pay-amt{font-size:30px;font-weight:900;margin:6px 0 2px}
.qr-box .pay-to{font-size:14px;color:#555}
.qr-missing{padding:28px 10px;color:#555;font-weight:600}
.field label{display:block;font-weight:800;margin-bottom:6px}
.field input{width:100%;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:22px;font-weight:700;letter-spacing:1px}
.field .hint{min-height:22px;margin-top:6px;font-weight:700;font-size:15px}
.hint.ok{color:var(--veg)} .hint.warn{color:#D9480F} .hint.info{color:var(--muted)}
.wa-btn{width:100%;min-height:54px;border-radius:14px;background:#1FA855;color:#fff;font-weight:800;font-size:17px;margin-top:10px}
.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-btn{min-height:72px;border-radius:var(--radius-l);font-size:20px;font-weight:900;color:#fff}
.pay-btn small{display:block;font-size:13px;font-weight:600;opacity:.9}
.pay-upi{background:#5B2BC9} .pay-cash{background:#1E7B34}
.cancel-btn{width:100%;min-height:48px;margin-top:8px;border-radius:14px;color:#D32F2F;font-weight:800;border:2px solid currentColor}
html[data-theme="night"] .cancel-btn{color:#FF7B7B}

/* option sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:92vh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 14px 10px}
.sheet-head h3{margin:0;font-size:22px;font-weight:900;flex:1;display:flex;gap:10px;align-items:center}
.sheet-head .no{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:#151412;display:grid;place-items:center;font-size:16px;flex:none}
.close-x{width:48px;height:48px;border-radius:14px;background:var(--surface-2);font-size:24px;font-weight:800}
.sheet-body{overflow-y:auto;padding:4px 14px 10px}
.orow{display:grid;grid-template-columns:minmax(120px,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.oname{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:flex-start;line-height:1.2}
.oname .dot{margin-top:3px}
.osizes{display:flex;gap:8px}
.sz{position:relative}
.sz-add{min-width:104px;min-height:62px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted)}
.sz-add b{font-size:19px;color:var(--text);font-weight:900}
.sz-add:active{background:var(--surface-2)}
.sz.has .sz-add{border-color:var(--yellow);border-width:3px}
.sz .tqty{top:-9px;right:-6px;min-width:30px;height:30px;font-size:15px}
.sz-minus{position:absolute;bottom:-8px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--text);color:var(--bg);font-size:22px;font-weight:900;line-height:1}
@media (max-width:380px){.orow{grid-template-columns:1fr}.osizes{justify-content:flex-end}}
.sheet-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.big-btn{width:100%;min-height:64px;border-radius:var(--radius-l);background:var(--btn-bg);color:var(--btn-text);font-size:19px;font-weight:900}

/* modal */
.modal-scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:18px}
.modal{width:100%;max-width:440px;background:var(--surface);color:var(--text);border-radius:22px;padding:22px 18px 18px}
.modal h3{margin:0 0 8px;font-size:23px;font-weight:900}
.modal p{margin:0 0 18px;font-size:18px;color:var(--muted);white-space:pre-line}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .row.one{grid-template-columns:1fr}
.m-no{min-height:60px;border-radius:16px;background:var(--surface-2);font-weight:800;font-size:18px}
.m-yes{min-height:60px;border-radius:16px;background:var(--btn-bg);color:var(--btn-text);font-weight:900;font-size:18px}
.m-yes.danger{background:#C62828;color:#fff}

/* toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:90;background:#151412;color:#fff;padding:14px 20px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:92vw;text-align:center}
html[data-theme="night"] .toast{background:#F4EFE2;color:#151412}

/* chooser */
.chooser{position:fixed;inset:0;z-index:80;background:#151412;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.chooser h1{margin:0;font-style:italic;font-weight:900;font-size:38px;color:#FFC21A;letter-spacing:-1px}
.chooser p{margin:0 0 6px;color:#cfc8b6;font-size:18px}
.choice{width:min(100%,460px);min-height:130px;border-radius:24px;display:flex;align-items:center;gap:18px;padding:18px 22px;text-align:left}
.choice .big{font-size:52px;line-height:1}
.choice b{display:block;font-size:28px;font-weight:900}
.choice span{font-size:17px;font-weight:600;opacity:.8}
.choice.ev{background:#FFF6DA;color:#151412;border:4px solid #FFC21A}
.choice.nt{background:#0A0F1F;color:#F4EFE2;border:4px solid #3A4A7A}

/* staff picker */
.staff-pick{position:fixed;inset:0;z-index:85;background:#151412;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));overflow-y:auto}
.staff-pick h1{margin:0;font-size:30px;font-weight:900;color:#FFC21A;text-align:center}
.staff-pick p{margin:0;color:#cfc8b6;font-size:18px}
.staff-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(100%,640px)}
.staff-btn{min-height:84px;border-radius:20px;background:#FFF6DA;color:#151412;font-size:22px;font-weight:900;border:4px solid #FFC21A;padding:8px}
.staff-cancel{color:#cfc8b6;font-weight:700;min-height:48px;padding:0 24px;border:2px solid #555;border-radius:14px}

/* summary */
.datebar{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
.datebar button{width:52px;height:52px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:900}
.datebar b{font-size:20px;min-width:170px;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .k{font-size:14px;font-weight:700;color:var(--muted)}
.stat .v{font-size:24px;font-weight:900}
.stat .s{font-size:14px;color:var(--muted);font-weight:600}
.stat.wide{grid-column:1/-1}
.stat.wide .v{font-size:40px;letter-spacing:-1px}
.sec{margin:20px 4px 8px;font-size:17px;font-weight:900}
.list{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px 14px}
.li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-weight:600}
.li:last-child{border-bottom:0}
.li .m{color:var(--muted);font-size:14px}
.li>b,.li>span:last-child{white-space:nowrap}
.actions{display:grid;gap:10px;margin-top:16px}
.act{min-height:58px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:17px}
.act.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.act.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-text)}
.status{padding:12px 14px;border-radius:14px;font-weight:700;background:var(--surface-2);margin-top:14px}
.status.bad{background:#FDE2E1;color:#8A1C14}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-weight:600}
.loading{padding:40px 10px;text-align:center;font-weight:700;color:var(--muted);font-size:18px}
button.li{width:100%;text-align:left;border-radius:0;background:none}
.li.void{opacity:.6}.li.void .amt{text-decoration:line-through}
.status .act{margin-top:10px;width:100%}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 6px}
.info dt{color:var(--muted);font-weight:700}.info dd{margin:0;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800}
.chip.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
.staff-row{display:flex;gap:8px;margin-bottom:8px}.staff-row input{flex:1}
.staff-row button{width:56px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:900}
.devcode{font-size:26px;font-weight:900;letter-spacing:4px}
.form .sec{margin:10px 0 0;font-size:19px}

/* settings */
.form{display:grid;gap:14px;max-width:640px;margin:0 auto}
.form .field input{font-size:18px;letter-spacing:0}
.form .note{font-size:14px;color:var(--muted);margin-top:4px}
.field textarea{width:100%;min-height:170px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px 14px;font-size:16px;line-height:1.4;resize:vertical}
.reward{margin-top:10px;padding:12px 14px;border-radius:14px;background:#FFF1C9;color:#4A3500;font-weight:700;border:2px dashed #E0A800}
html[data-theme="night"] .reward{background:#3A2E05;color:#FFE7A0;border-color:#FFC21A}
.reward button{display:block;width:100%;margin-top:10px;min-height:52px;border-radius:12px;background:#E0A800;color:#151412;font-weight:900;font-size:17px}
.stat .v.sm{font-size:18px;line-height:1.25}
.li .r{text-align:right;white-space:nowrap}
.ptabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.pitem{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.pitem h4{margin:0 0 6px;font-size:17px;font-weight:900}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .pn{flex:1 1 130px;font-weight:700}
.pc{display:flex;align-items:center;gap:6px}
.pc .pl{font-size:13px;color:var(--muted);font-weight:700;min-width:34px}
.pc label{display:flex;align-items:center;gap:3px;font-size:16px}
.pc input{width:74px;min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);text-align:center;font-size:17px;font-weight:800}
.pc input.chg{border-color:#E0A800;background:#FFF1C9;color:#151412}
</style>
</head>
<body>

<header class="top">
  <button class="brand" id="brand" aria-label="Change staff"><span id="brandName">Momos BC</span><small id="brandSub"></small></button>
  <button class="menu-badge" id="menuBadge" aria-label="Change menu"><span class="ico" id="menuIco">☀️</span><span><span id="menuName">Evening</span><span class="chg">Tap to change</span></span></button>
  <button class="icon-btn" id="sumBtn" aria-label="Sales summary">📊<span class="pend hidden" id="pend"></span></button>
</header>
<div class="nudge hidden" id="nudge"><span id="nudgeText"></span><button id="nudgeBtn">Switch</button></div>
<nav class="tabs" id="tabs"></nav>
<main id="grid"></main>

<div class="bar"><button id="barBtn" disabled></button></div>

<!-- Bill -->
<section class="layer hidden" id="billLayer" aria-label="Bill">
  <div class="layer-head"><button class="back-btn" data-close>← Add items</button><h2>Bill <span id="billMenu" style="font-size:16px;opacity:.85"></span></h2></div>
  <div class="layer-body">
    <div class="bill-wrap">
        <div class="card b-items"><div id="billLines"></div>
          <div class="grand"><span>Grand total</span><b id="billTotal">₹0</b></div>
        </div>
        <div class="card field b-mobile">
          <label for="mobile">Customer mobile</label>
          <input id="mobile" type="tel" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="10-digit number">
          <div class="hint" id="mobileHint"></div>
          <div class="reward hidden" id="rewardBox"></div>
          <button class="wa-btn hidden" id="waBillBtn">Send bill on WhatsApp</button>
        </div>
      <div class="qr-box b-qr" id="qrBox"></div>
    </div>
  </div>
  <div class="layer-foot">
    <div class="pay-row">
      <button class="pay-btn pay-upi" id="payUpi">Paid by UPI<small>Scanned QR</small></button>
      <button class="pay-btn pay-cash" id="payCash">Paid by Cash<small>Cash received</small></button>
    </div>
    <button class="cancel-btn" id="cancelBill">Cancel bill</button>
  </div>
</section>

<!-- Summary -->
<section class="layer hidden" id="sumLayer" aria-label="Sales summary">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2>Sales summary</h2></div>
  <div class="layer-body" id="sumBody"></div>
</section>

<!-- Bill detail -->
<section class="layer hidden" id="detLayer" aria-label="Bill details">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2 id="detTitle">Bill</h2></div>
  <div class="layer-body" id="detBody"></div>
</section>

<!-- Settings -->
<section class="layer hidden" id="setLayer" aria-label="Settings">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2>Owner settings</h2></div>
  <div class="layer-body" id="setBody"></div>
</section>

<!-- Prices -->
<section class="layer hidden" id="priceLayer" aria-label="Edit prices">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2>Edit prices</h2></div>
  <div class="layer-body" id="priceBody"></div>
  <div class="layer-foot"><button class="big-btn" id="priceSave">Save prices</button></div>
</section>

<!-- Option sheet -->
<div class="scrim hidden" id="optScrim"><div class="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head"><h3 id="optTitle"></h3><button class="close-x" id="optClose" aria-label="Close">✕</button></div>
  <div class="sheet-body" id="optBody"></div>
  <div class="sheet-foot"><button class="big-btn" id="optDone">Done</button></div>
</div></div>

<!-- Modal -->
<div class="modal-scrim hidden" id="modal"><div class="modal" role="alertdialog" aria-modal="true">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <div class="row" id="mRow"><button class="m-no" id="mNo">No</button><button class="m-yes" id="mYes">Yes</button></div>
</div></div>

<!-- Chooser -->
<div class="chooser hidden" id="chooser">
  <h1 id="chooserBrand">Momos BC</h1>
  <p>Choose the menu to start billing</p>
  <button class="choice ev" data-menu="evening"><span class="big">☀️</span><span><b>Evening menu</b><span>6:00 PM – 12:00 AM</span></span></button>
  <button class="choice nt" data-menu="night"><span class="big">🌙</span><span><b>Night menu</b><span>12:00 AM – 6:00 AM</span></span></button>
</div>

<!-- Staff picker -->
<div class="staff-pick hidden" id="staffPick">
  <h1>Who is billing today?</h1>
  <p>Tap your name</p>
  <div class="staff-list" id="staffList"></div>
  <button class="staff-cancel hidden" id="staffCancel">Cancel</button>
</div>

<div class="toast hidden" id="toast"></div>
<input type="file" id="restoreFile" accept="application/json,.json" class="hidden">

const businessDate=d=>ymd(new Date(d.getTime()-12*36e5));

const fmtClock=stamp=>{const h=+stamp.slice(11,13),m=stamp.slice(14,16);if(isNaN(h))return stamp;return ((h%12)||12)+":"+m+(h<12?" am":" pm");};
const localStamp=d=>ymd(d)+" "+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
const ordinal=n=>{const s=["th","st","nd","rd"],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);};
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(18);}catch(e){}};

function lineName(l){return l.name+(l.opt?" – "+l.opt:"")+(l.size?" ("+l.size+")":"");}
function cartCount(){return cart.reduce((a,l)=>a+l.qty,0);}
function cartTotal(){return cart.reduce((a,l)=>a+l.qty*l.price,0);}
function qtyOf(itemId){return cart.filter(l=>l.itemId===itemId&&!l.free).reduce((a,l)=>a+l.qty,0);}
function qtyKey(key){const l=cart.find(x=>x.key===key);return l?l.qty:0;}
function catOf(l){return l.cat||NAME_CAT[l.item||l.name]||"other";}
function platesOf(l){return (catOf(l)==="momos"&&l.size==="Half"?0.5:1)*l.qty;}
function saveCart(){S.set("cart",cart);}
function pendingCount(){return bills.filter(b=>!b.synced).length;}

let toastT;
function toast(msg,ms){const t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add("hidden"),ms||2400);}

function ask({title,text="",yes="Yes",no="No",danger=false}){
  return new Promise(res=>{
    $("mTitle").textContent=title;$("mText").textContent=text;
    $("mYes").textContent=yes;$("mYes").classList.toggle("danger",danger);
    $("mNo").classList.toggle("hidden",!no);$("mRow").classList.toggle("one",!no);
    if(no)$("mNo").textContent=no;
    $("modal").classList.remove("hidden");
    const done=v=>{$("modal").classList.add("hidden");$("mYes").onclick=$("mNo").onclick=null;res(v);};
    $("mYes").onclick=()=>done(true);$("mNo").onclick=()=>done(false);
  });
}

window.addEventListener("popstate",()=>{

  $(id).classList.add("hidden");

  if(id==="billLayer"){renderGrid();renderBar();}

async function requestSwitch(){
  const to=menu==="night"?"evening":"night";
  const label=to==="night"?"Night menu":"Evening menu";
  if(cart.length){await ask({title:"Finish this bill first",text:"Mark the current bill as paid or cancel it before changing the menu.",yes:"OK",no:null});return;}
  if(await ask({title:"Switch to "+label+"?",text:label+" prices will be used for all new bills.",yes:"Switch",no:"Keep "+(menu==="night"?"Night":"Evening")})){setMenu(to);toast(label+" is on");}
}

function checkNudge(){
  const h=new Date().getHours();let msg="";
  if(menu==="evening"&&h>=0&&h<6)msg="It is after 12 AM. Night menu prices apply now.";
  if(menu==="night"&&h>=18)msg="It is evening. Evening menu prices apply now.";
  $("nudge").classList.toggle("hidden",!msg);$("nudgeText").textContent=msg;

function priceLabel(item){
  const m=mi();
  if(item.price)return rs(item.price[m]);
  const all=item.options.flatMap(o=>o.sizes.map(s=>s.price[m]));
  const lo=Math.min(...all),hi=Math.max(...all);
  return lo===hi?rs(lo):`<small>from</small> ${rs(lo)}`;
}
function tileHTML(item){
  const q=qtyOf(item.id);
  const lead=item.no?`<span class="no">${item.no}</span>`:(item.veg!==undefined?`<i class="dot ${item.veg?"v":"n"}"></i>`:"");
  return `<div class="tile${q?" has":""}">
    <button class="tile-add" data-id="${item.id}"><span class="tname">${lead}<span>${esc(item.name)}</span></span><span class="tprice">${priceLabel(item)}</span></button>
    ${q?`<span class="tqty">${q}</span>`:""}
    ${q&&item.price?`<button class="tile-minus" data-minus="${item.id}" aria-label="Remove one">−</button>`:""}
  </div>`;
}
function renderGrid(){
  const items=MENU.filter(i=>i.cat===curCat);
  const groups=[];items.forEach(i=>{const g=i.group||"";let G=groups.find(x=>x.g===g);if(!G)groups.push(G={g,items:[]});G.items.push(i);});
  $("grid").innerHTML=groups.map(G=>(groups.length>1&&G.g?`<div class="group-title">${esc(G.g)}</div>`:"")+`<div class="grid">${G.items.map(tileHTML).join("")}</div>`).join("");
}
$("grid").addEventListener("click",e=>{
  const minus=e.target.closest("[data-minus]");
  if(minus){changeQty(minus.dataset.minus+"||",-1);renderGrid();renderBar();return;}
  const b=e.target.closest(".tile-add");if(!b)return;
  const item=BY_ID[b.dataset.id];
  if(item.price){addLine(item,null,null);renderGrid();renderBar();}
  else openOptions(item);
});
function addLine(item,opt,size){
  const m=mi();
  const key=item.id+"|"+(opt?opt.key:"")+"|"+(size&&size.name?size.name:"");
  const l=cart.find(x=>x.key===key);
  if(l)l.qty++;
  else cart.push({key,itemId:item.id,name:item.name,cat:item.cat,opt:opt?opt.name:"",size:size&&size.name?size.name:"",
    veg:opt?opt.veg:item.veg,price:size?size.price[m]:item.price[m],qty:1});
  saveCart();buzz();
}
function changeQty(key,d){
  const l=cart.find(x=>x.key===key);if(!l)return;
  l.qty+=d;if(l.qty<=0)cart=cart.filter(x=>x!==l);saveCart();buzz();
}

/* customer mobile, visits, rewards */
let lookupSeq=0,visitNo=0;const remoteCache={};
// visit counts are looked up fresh for every bill, so other devices' visits are never missed
const clearVisitCache=()=>Object.keys(remoteCache).forEach(k=>delete remoteCache[k]);
function localVisits(m){return bills.filter(b=>b.mobile===m&&b.status!=="Voided").length;}
function updateMobileHint(){
  const h=$("mobileHint"),m=mobile;
  $("waBillBtn").classList.toggle("hidden",!validMobile(m));
  if(!validMobile(m)){visitNo=0;renderReward();}
  if(!m){h.className="hint";h.textContent="";return;}
  if(m.length<10){h.className="hint info";h.textContent=(10-m.length)+" more digit"+(10-m.length>1?"s":"");return;}
  if(!validMobile(m)){h.className="hint warn";h.textContent="Check the number (should start with 6, 7, 8 or 9)";return;}
  showVisits(Math.max(localVisits(m),remoteCache[m]||0));
  if(remoteCache[m]!==undefined)return;
  const seq=++lookupSeq;
  remoteVisits(m).then(n=>{if(n==null)return;remoteCache[m]=n;if(seq===lookupSeq&&mobile===m)showVisits(Math.max(n,localVisits(m)));});
}
function showVisits(prev){
  const h=$("mobileHint");visitNo=prev+1;
  if(prev>0){h.className="hint ok";h.textContent="★ Returning customer – "+ordinal(visitNo)+" visit";}
  else{h.className="hint info";h.textContent="New customer";}

}
const every=()=>+cfg.rewardEvery||0;
function isRewardVisit(){const n=every();return validMobile(mobile)&&n>0&&visitNo>1&&visitNo%n===0;}
function isTeaserVisit(){const n=every();return validMobile(mobile)&&n>1&&visitNo>=1&&(visitNo+1)%n===0;}
function rewardOK(){return isRewardVisit()&&cartTotal()>=+cfg.rewardMin;}
function teaserText(){return `🎁 *Your next visit gets a FREE Mojito* on orders of ${rs(+cfg.rewardMin)} or more!`;}
function renderReward(){

/* payment */
async function pay(mode){
  if(!cart.length)return;
  if(cfg.staff.length&&!currentStaff()){showStaffPicker(false);return;}
  if(cart.some(l=>l.free)&&!rewardOK()){
    if(await ask({title:"Remove the free Mojito?",text:`It is only for every ${ordinal(every())} visit of a customer whose mobile number is entered, on orders of ${rs(+cfg.rewardMin)} or more.`,yes:"Remove it",no:"Go back"})){
      cart=cart.filter(l=>!l.free);saveCart();renderBill();renderBar();}
    return;
  }
  const t=cartTotal();
  let note="";
  if(mobile&&!validMobile(mobile))note="\nThe mobile number looks incomplete, so it will not be saved.";
  const ok=await ask({title:(mode==="UPI"?"UPI payment received?":"Cash received?"),text:`${rs(t)} by ${mode==="UPI"?"UPI":"cash"}.${note}`,yes:"Yes, save bill",no:"Not yet"});
  if(!ok)return;
  const now=new Date(),bd=businessDate(now);
  const seq=bills.filter(b=>b.bdate===bd&&b.device===device).reduce((a,b)=>Math.max(a,b.seq||0),0)+1;
  const okMob=validMobile(mobile);
  const bill={
    id:device+bd.replace(/-/g,"").slice(2)+"-"+String(seq).padStart(3,"0"),
    seq,device,ts:now.toISOString(),local:localStamp(now),bdate:bd,menu,staff:currentStaff(),
    lines:cart.map(l=>({n:lineName(l),item:l.name,cat:catOf(l),opt:l.opt,size:l.size,price:l.price,qty:l.qty,free:!!l.free})),
    count:cartCount(),total:t,mode,mobile:okMob?mobile:"",visit:okMob?visitNo:0,reward:cart.some(l=>l.free),
    status:"",voidReason:"",synced:false
  };
  bills.push(bill);
  if(!S.set("bills",bills))toast("Warning: this device could not save the bill",4000);
  clearVisitCache();
  cart=[];mobile="";saveCart();
  closeLayer();renderGrid();renderBar();renderHeader();
  toast(`Bill #${seq} saved · ${rs(t)} ${mode}. Ready for next customer.`,3000);
  syncPending();
}

/* =========================================================
   GOOGLE SHEET  (free, via Google Apps Script)
   ========================================================= */
function sheetLink(params,base,token){
  const u=base||local.sheetUrl;
  return u+(u.includes("?")?"&":"?")+new URLSearchParams(Object.assign({token:token!==undefined?token:local.token},params));
}
async function withTimeout(ms,fn){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{return await fn(c.signal);}
  catch(e){if(e.name==="AbortError")throw new Error("The Google Sheet took too long to answer");throw e;}
  finally{clearTimeout(t);}
}
const sheetGet=(params,ms=12000)=>withTimeout(ms,async sig=>(await fetch(sheetLink(params),{signal:sig})).json());
const sheetPost=(body,ms=25000)=>withTimeout(ms,async sig=>(await fetch(local.sheetUrl,{method:"POST",signal:sig,
  headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:local.token},body))})).json());

function payloadBill(b){
  return {id:b.id,device:b.device,local:b.local,bdate:b.bdate,menu:b.menu,staff:b.staff||"",
    lines:b.lines.map(l=>Object.assign({},l,{cat:catOf(l),plates:platesOf(l)})),
    count:b.count,total:b.total,mode:b.mode,mobile:b.mobile,visit:b.visit||0,reward:!!b.reward,
    status:b.status||"",voidReason:b.voidReason||"",voidedAt:b.voidedAt||""};
}
let syncPromise=null,lastSyncError="";
function syncPending(){if(!syncPromise)syncPromise=doSync().finally(()=>{syncPromise=null;});return syncPromise;}
async function doSync(){
  if(!local.sheetUrl)return;
  const pending=bills.filter(b=>!b.synced);if(!pending.length)return;
  if(!navigator.onLine){lastSyncError="No internet";return;}
  try{
    for(let i=0;i<pending.length;i+=25){
      const batch=pending.slice(i,i+25);
      const data=await sheetPost({bills:batch.map(payloadBill)});
      if(!data.ok)throw new Error(data.error||"The Sheet refused the data");
      const saved=new Set(data.saved||[]);
      batch.forEach(b=>{if(saved.has(b.id))b.synced=true;});
      S.set("bills",bills);
    }
    lastSyncError="";
  }catch(e){lastSyncError=e.message||"Could not reach the Sheet";}
  renderHeader();
}
async function remoteVisits(m){
  if(!local.sheetUrl||!navigator.onLine)return null;
  try{const d=await sheetGet({action:"visits",mobile:m},4000);return d.ok?Number(d.visits)||0:null;}catch(e){return null;}
}

/* shared settings travel through the Sheet; newest version wins */
function adoptConfig(c){
  cfg=pickShared(c);if(!Array.isArray(cfg.staff))cfg.staff=[];if(!cfg.prices)cfg.prices={};
  cfgMeta={v:Number(c.v)||0,dirty:false};S.set("cfg",cfg);S.set("cfgMeta",cfgMeta);
  applyPrices();applyMenu();checkStaff();
}
async function pushConfig(){
  if(!local.sheetUrl)return "local";
  if(!navigator.onLine)return "error";
  try{
    const d=await sheetPost({action:"setConfig",config:Object.assign({v:cfgMeta.v},pickShared(cfg))});
    if(!d.ok)return "error";
    if(d.config&&Number(d.config.v)>cfgMeta.v){adoptConfig(d.config);return "older";}
    cfgMeta.dirty=false;S.set("cfgMeta",cfgMeta);return "shared";
  }catch(e){return "error";}
}
async function pullConfig(){
  if(!local.sheetUrl)return "nosheet";
  if(!navigator.onLine)return "offline";
  try{
    const d=await sheetGet({action:"config"},10000);if(!d.ok)return "error";
    const c=d.config;
    if(!c){if(!cfgMeta.v)cfgMeta.v=Date.now();cfgMeta.dirty=true;S.set("cfgMeta",cfgMeta);return (await pushConfig())==="shared"?"seeded":"error";}
    if(cfgMeta.dirty&&cfgMeta.v>=Number(c.v))return (await pushConfig())==="shared"?"pushed":"error";
    if(Number(c.v)>cfgMeta.v){adoptConfig(c);return "loaded";}
    return "same";
  }catch(e){return "error";}
}
async function saveCfg(){
  cfgMeta={v:Date.now(),dirty:true};S.set("cfg",cfg);S.set("cfgMeta",cfgMeta);
  applyPrices();applyMenu();checkStaff();
  return pushConfig();
}
const cfgResultMsg=(r,what)=>r==="shared"?what+" saved for all devices":r==="local"?what+" saved on this device":r==="older"?"Someone saved newer settings on another device. Those are now loaded.":what+" saved here. They will reach other devices when this one is online.";

window.addEventListener("online",()=>{syncPending();pullConfig();});

setInterval(pullConfig,5*60000);

/* =========================================================
   SUMMARY  (built from the Google Sheet = all devices)
   ========================================================= */
let sumDate=businessDate(new Date()),sumList=[],sumState="",sumErr="",sumSeq=0;
function shiftDate(s,d){const [y,m,dd]=s.split("-").map(Number);return ymd(new Date(y,m-1,dd+d));}
async function loadSummary(){
  const seq=++sumSeq;
  if(!local.sheetUrl){sumState="nosheet";sumList=bills.filter(b=>b.bdate===sumDate);renderSummary();return;}
  if(!navigator.onLine){sumState="offline";renderSummary();return;}
  sumState="loading";renderSummary();
  await syncPending();
  try{
    const d=await sheetGet({action:"day",date:sumDate},25000);
    if(seq!==sumSeq)return;
    if(!d.ok)throw new Error(d.error||"Sheet error");
    sumList=d.bills||[];sumState="ok";
  }catch(e){if(seq!==sumSeq)return;sumState="error";sumErr=e.message||"Could not reach the Google Sheet";}
  renderSummary();
}
function summarize(all){
  const list=all.filter(b=>b.status!=="Voided"),voided=all.filter(b=>b.status==="Voided");
  const sum=arr=>arr.reduce((a,b)=>a+Number(b.total||0),0);
  const upi=list.filter(b=>b.mode==="UPI"),cash=list.filter(b=>b.mode==="Cash");
  const ev=list.filter(b=>b.menu==="evening"),nt=list.filter(b=>b.menu==="night");
  const add=(o,k,v)=>{o[k]=(o[k]||0)+v;};
  const filling={},dish={},burgers={},sandwiches={},rolls={},prod={},staff={};
  const plates={momos:0,burgers:0,sandwiches:0,rolls:0,pao:0,fries:0,nachos:0,drinks:0};
  let free=0;
  list.forEach(b=>{
    const who=b.staff||"Not set";staff[who]=staff[who]||{n:0,t:0};staff[who].n++;staff[who].t+=Number(b.total||0);
    (b.lines||[]).forEach(l=>{
      const c=catOf(l),p=platesOf(l);
      if(l.size==="FREE")free+=l.qty;
      add(prod,l.item+(l.opt?" – "+l.opt:""),p);
      if(c==="momos"){plates.momos+=p;add(filling,l.opt||"Other",p);add(dish,l.item,p);}
      else if(c==="burgers"){plates.burgers+=p;add(burgers,l.item+(l.opt?" – "+l.opt:""),p);}
      else if(c==="sandwiches"){plates.sandwiches+=p;add(sandwiches,l.item,p);}
      else if(c==="rolls"){if(l.item==="Pao Bhaji")plates.pao+=p;else{plates.rolls+=p;add(rolls,l.item,p);}}
      else if(c in plates)plates[c]+=p;
    });
  });
  const sorted=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const total=sum(list);
  return {all,list,voided,voidedTotal:sum(voided),total,upi:sum(upi),upiN:upi.length,cash:sum(cash),cashN:cash.length,
    ev:sum(ev),evN:ev.length,nt:sum(nt),ntN:nt.length,avg:list.length?Math.round(total/list.length):0,most:sorted(prod)[0],
    plates,free,rewards:list.filter(b=>b.reward).length,staff:Object.entries(staff).sort((a,b)=>b[1].t-a[1].t),
    filling:sorted(filling),dish:sorted(dish),burgers:sorted(burgers),sandwiches:sorted(sandwiches),rolls:sorted(rolls),
    withMobile:list.filter(b=>b.mobile).length};
}
const listBox=(rows)=>`<div class="list">${rows.join("")}</div>`;

function renderSummary(){
  const today=businessDate(new Date()),pend=pendingCount();
  let head=`<div class="datebar"><button id="dPrev" aria-label="Previous day">‹</button><b>${sumDate===today?"Today":fmtDate(sumDate)}</b><button id="dNext" aria-label="Next day" ${sumDate>=today?"disabled style='opacity:.3'":""}>›</button></div>`;
  if(!storageOK)head+=`<div class="status bad">This device is not saving data. Open the app from the home screen icon, not from a file.</div>`;
  if(local.sheetUrl&&pend)head+=`<div class="status bad">${bl(pend)} from this device not uploaded yet${lastSyncError?" ("+esc(lastSyncError)+")":""}.<button class="act primary" id="syncNow">Send now</button></div>`;
  let body="";
  if(sumState==="loading")body=`<div class="loading">Loading the summary from Google Sheet…</div>`;
  else if(sumState==="offline")body=`<div class="status bad">The summary needs internet, because it combines bills from all devices. Billing still works offline.</div>`;
  else if(sumState==="error")body=`<div class="status bad">Could not load the summary: ${esc(sumErr)}<button class="act" id="retrySum">Try again</button></div>`;

  $("sumBody").innerHTML=head+body+`
    <div class="actions">

  $("dNext").onclick=()=>{if(sumDate<today){sumDate=shiftDate(sumDate,1);loadSummary();}};
  if($("syncNow"))$("syncNow").onclick=async()=>{toast("Sending…");await syncPending();toast(lastSyncError?"Not sent: "+lastSyncError:"Sent to Google Sheet");loadSummary();};
  if($("retrySum"))$("retrySum").onclick=loadSummary;

  $("backupBtn").onclick=backup;
  $("restoreBtn").onclick=()=>$("restoreFile").click();
  $("settingsBtn").onclick=openSettings;
}

    (s.most?`Most sold: ${s.most[0]} (${pl(s.most[1])})\n`:"")+
    sec("By staff",s.staff,([n,v])=>`${n}: ${rs(v.t)} (${bl(v.n)})`)+
    sec("Plates sold",[["Momos",P.momos],["Burgers",P.burgers],["Sandwiches",P.sandwiches],["Cigar rolls",P.rolls],["Pao Bhaji",P.pao],["Fries",P.fries],["Nachos",P.nachos],["Drinks",P.drinks]].filter(r=>r[1]),r=>`${r[0]}: ${pl(r[1])}`)+
    sec("Momos by filling (plates / pcs)",s.filling,r=>`${r[0]}: ${pl(r[1])} / ${pl(r[1]*8)} pcs`)+
    sec("Momos by dish",s.dish,r=>`${r[0]}: ${pl(r[1])}`)+
    sec("Burgers",s.burgers,r=>`${r[0]}: ${pl(r[1])}`)+
    sec("Sandwiches",s.sandwiches,r=>`${r[0]}: ${pl(r[1])}`)+
    sec("Cigar rolls",s.rolls,r=>`${r[0]}: ${pl(r[1])}`)+
    `\nBills with mobile: ${s.withMobile}\nFree Mojitos given: ${s.rewards}`+(s.voided.length?`\nVoided bills: ${s.voided.length} (${rs(s.voidedTotal)})`:"");
  const num=(cfg.ownerWa||"").replace(/\D/g,"");
  if(num){window.open("https://wa.me/"+(num.length===10?"91"+num:num)+"?text="+encodeURIComponent(txt),"_blank");return;}
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});}
  else window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
}

/* bill details + void (owner only) */
let detBill=null,voidReason="";
const REASONS=["Wrong items","Wrong payment mode","Test bill","Other"];
function openDetail(b){detBill=b;voidReason="";renderDetail();openLayer("detLayer");}
function renderDetail(){
  const b=detBill,voided=b.status==="Voided";
  $("detTitle").textContent="Bill "+shortId(b);
  $("detBody").innerHTML=`
    ${voided?`<div class="status bad" style="margin:0 0 14px">Voided${b.voidReason?" – "+esc(b.voidReason):""}. Not counted in any totals.</div>`:""}
    <div class="card"><dl class="info">
      <dt>Bill ID</dt><dd>${esc(b.id)}</dd>
      <dt>Time</dt><dd>${esc(fmtDate(b.bdate))}, ${esc(fmtClock(String(b.local)))}</dd>
      <dt>Menu</dt><dd>${b.menu==="night"?"🌙 Night":"☀️ Evening"}</dd>
      <dt>Staff</dt><dd>${esc(b.staff||"–")}</dd>
      <dt>Payment</dt><dd>${esc(b.mode)}</dd>
      <dt>Mobile</dt><dd>${maskMobile(b.mobile)}${b.visit?` · ${ordinal(+b.visit)} visit`:""}</dd>
    </dl>
    ${(b.lines||[]).map(l=>`<div class="line"><div class="ln"><span>${esc(l.n||l.item)}</span></div><div class="la">${rs(l.price*l.qty)}</div><div class="lp">${rs(l.price)} × ${l.qty}</div></div>`).join("")}
    <div class="grand"><span>Total</span><b>${rs(b.total)}</b></div></div>
    ${voided?"":`
      <button class="cancel-btn" id="voidOpen" style="margin-top:16px">Void this bill</button>
      <div class="card hidden" id="voidForm" style="margin-top:14px">
        <div class="field"><label>Reason</label></div>
        <div class="chips">${REASONS.map(r=>`<button class="chip${r===voidReason?" on":""}" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>
        <div class="field"><label for="voidPin">Owner PIN</label><input id="voidPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><div class="hint warn" id="voidHint"></div></div>
        <button class="m-yes danger" id="voidGo" style="width:100%;margin-top:6px">Void bill</button>
      </div>`}`;
  if(voided)return;
  $("voidOpen").onclick=()=>{$("voidForm").classList.remove("hidden");$("voidOpen").classList.add("hidden");};
  $("detBody").querySelectorAll("[data-r]").forEach(c=>c.onclick=()=>{voidReason=c.dataset.r;$("detBody").querySelectorAll("[data-r]").forEach(x=>x.classList.toggle("on",x===c));});
  $("voidGo").onclick=doVoid;
}
async function doVoid(){
  const hint=$("voidHint"),btn=$("voidGo"),b=detBill;
  if(!voidReason){hint.textContent="Choose a reason";return;}
  if($("voidPin").value!==cfg.pin){hint.textContent="Wrong PIN";$("voidPin").value="";return;}
  const loc=bills.find(x=>x.id===b.id);
  if(local.sheetUrl&&!loc&&!navigator.onLine){hint.textContent="Voiding a bill from another device needs internet";return;}
  btn.disabled=true;btn.textContent="Voiding…";
  const stamp=localStamp(new Date());
  if(loc){
    // bill made on this device: mark it and send it again; the Sheet updates the existing row
    loc.status="Voided";loc.voidReason=voidReason;loc.voidedAt=stamp;loc.synced=false;S.set("bills",bills);
    await syncPending();
  }else{
    try{const d=await sheetPost({action:"void",id:b.id,reason:voidReason,device,at:stamp});if(!d.ok)throw new Error(d.error||"Not voided");}
    catch(e){hint.textContent=e.message||"Could not reach the Sheet";btn.disabled=false;btn.textContent="Void bill";return;}
  }
  b.status="Voided";b.voidReason=voidReason;
  closeLayer();
  toast(loc&&!loc.synced&&local.sheetUrl?"Voided on this device. It will reach the Sheet when online.":"Bill voided",3500);
  renderHeader();loadSummary();
}

/* files */
function download(name,text,type){
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function downloadCSV(list){
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows=[["Bill ID","Business date","Time","Menu","Staff","Payment","Mobile","Status","Category","Item","Option","Size","Price","Qty","Plates","Amount","Bill total"]];
  list.forEach(b=>(b.lines||[]).forEach(l=>rows.push([b.id,b.bdate,b.local,b.menu,b.staff,b.mode,b.mobile,b.status,catOf(l),l.item,l.opt,l.size,l.price,l.qty,platesOf(l),l.price*l.qty,b.total])));
  download(`sales-${sumDate}${sumState==="ok"?"-all-devices":"-"+device}.csv`,"\uFEFF"+rows.map(r=>r.map(q).join(",")).join("\r\n"),"text/csv");
}
function backup(){
  download(`momos-bc-backup-${device}-${ymd(new Date())}.json`,JSON.stringify({app:"momos-bc-pos",v:3,at:new Date().toISOString(),device,cfg,menu,bills}),"application/json");
  toast("Backup file downloaded");
}
$("restoreFile").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const d=JSON.parse(await f.text());if(d.app!=="momos-bc-pos")throw 0;
    if(!await ask({title:"Restore this backup?",text:`${d.bills.length} bills from ${new Date(d.at).toLocaleString("en-IN")}.\nBills already on this device are kept.`,yes:"Restore",no:"Cancel"}))return;
    const have=new Set(bills.map(b=>b.id));d.bills.forEach(b=>{if(!have.has(b.id))bills.push(Object.assign({},b,{synced:false}));});
    bills.sort((a,b)=>a.ts<b.ts?-1:1);S.set("bills",bills);
    if(!local.sheetUrl&&(d.cfg||d.settings)){cfg=pickShared(d.cfg||d.settings);S.set("cfg",cfg);applyPrices();applyMenu();}
    toast("Backup restored");syncPending().then(loadSummary);
  }catch(err){ask({title:"Not a backup file",text:"Choose a file made with \"Back up this device's data\".",yes:"OK",no:null});}
});

/* =========================================================
   OWNER SETTINGS (PIN protected)
   ========================================================= */
function openSettings(){
  $("setBody").innerHTML=`<div class="form">
    <div class="field"><label for="pinIn">Enter owner PIN</label><input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><div class="hint warn" id="pinHint"></div></div>
    <button class="big-btn" id="pinGo">Open settings</button></div>`;
  openLayer("setLayer");
  setTimeout(()=>{const i=$("pinIn");if(i)i.focus();},150);
  const go=()=>{if($("pinIn").value===cfg.pin)renderSettings();else{$("pinHint").textContent="Wrong PIN";$("pinIn").value="";}};
  $("pinGo").onclick=go;$("pinIn").onkeydown=e=>{if(e.key==="Enter")go();};
}
let staffDraft=[];
function renderStaffEd(){
  $("staffEd").innerHTML=staffDraft.length?staffDraft.map((n,i)=>`<div class="staff-row"><input value="${esc(n)}" data-si="${i}" maxlength="24" aria-label="Staff name ${i+1}"><button data-rm="${i}" aria-label="Remove">✕</button></div>`).join(""):`<div class="note">No staff added. Bills won't record who made them.</div>`;
}
function readStaff(){if($("staffEd"))$("staffEd").querySelectorAll("[data-si]").forEach(i=>{staffDraft[+i.dataset.si]=i.value;});}
function renderSettings(){
  const f=(id,label,val,note,type="text",mode="text")=>`<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" inputmode="${mode}" value="${esc(val)}" autocomplete="off">${note?`<div class="note">${note}</div>`:""}</div>`;
  staffDraft=cfg.staff.slice();
  $("setBody").innerHTML=`<div class="form">
    <div class="sec">Shared with all devices</div>
    <div class="note">Saved to the Google Sheet and picked up by every device within a few minutes.</div>
    <div class="field"><label>Staff names</label><div id="staffEd"></div><button class="act" id="staffAdd" style="width:100%">+ Add staff name</button>
      <div class="note">Workers pick their name when the app opens each day. Removing a name keeps it on past bills.</div></div>
    ${f("sShop","Shop name",cfg.shop,"Shown in the header, bills and WhatsApp messages.")}
    ${f("sUpi","UPI ID",cfg.upi,"The QR on every bill uses this, with the amount filled in.")}
    ${f("sPayee","Name on UPI QR",cfg.payee,"Shown to the customer in their payment app.")}
    ${f("sWa","Owner WhatsApp number",cfg.ownerWa,"Optional. If set, the summary goes straight to this number.","tel","numeric")}
    ${f("sPin","Owner PIN",cfg.pin,"4 to 8 digits. Needed for settings and for voiding bills.","tel","numeric")}
    ${f("sEvery","Free Mojito on every Nth visit",cfg.rewardEvery,"3 means the 3rd, 6th, 9th visit… The visit before gets a reminder. 0 switches rewards off.","tel","numeric")}
    ${f("sMin","Reward minimum order (₹)",cfg.rewardMin,"Orders of this amount or more qualify.","tel","numeric")}
    <div class="field"><label for="sMsg">Message at the end of the WhatsApp bill</label><textarea id="sMsg">${esc(cfg.billMsg)}</textarea><div class="note">Put *stars* around text to make it bold in WhatsApp.</div></div>
    <button class="act" id="sPrices">✏️ Edit item prices</button>
    <div class="sec" style="margin-top:18px">This device only</div>
    ${f("sUrl","Google Sheet web app URL",local.sheetUrl,"From Apps Script, ends with /exec. When you connect a device, it loads the shared settings from the Sheet.","url","url")}
    ${f("sTok","Sheet secret key",local.token,"Same as SECRET in the Apps Script code.")}
    <div class="field"><label>Device code</label><div class="devcode">${device}</div><div class="note">Set automatically. Bill numbers from this device start with it.</div></div>
    <button class="act" id="sTest">Test Google Sheet connection</button>
    <button class="big-btn" id="sSave">Save settings</button>
  </div>`;
  renderStaffEd();
  $("staffAdd").onclick=()=>{readStaff();staffDraft.push("");renderStaffEd();const ins=$("staffEd").querySelectorAll("input");ins[ins.length-1].focus();};
  $("staffEd").onclick=e=>{const b=e.target.closest("[data-rm]");if(!b)return;readStaff();staffDraft.splice(+b.dataset.rm,1);renderStaffEd();};
  $("sPrices").onclick=()=>{priceDraft={};priceCat="momos";renderPrices();openLayer("priceLayer");};
  $("sTest").onclick=async()=>{
    const url=$("sUrl").value.trim(),tok=$("sTok").value.trim();
    if(!url){toast("Paste the web app URL first");return;}
    try{const d=await withTimeout(12000,async sig=>(await fetch(sheetLink({action:"ping"},url,tok),{signal:sig})).json());
      toast(d.ok?"✓ Connected to "+(d.sheet||"Google Sheet"):"Sheet replied: "+(d.error||"error"),3500);}
    catch(e){toast("Could not reach the Sheet. Check the URL and internet.",3500);}
  };
  $("sSave").onclick=saveSettings;
}
async function saveSettings(){
  const v=id=>$(id).value.trim();
  readStaff();
  const ev=parseInt(v("sEvery"),10),mn=parseInt(v("sMin"),10);
  if(!/^\d{4,8}$/.test(v("sPin"))){ask({title:"PIN must be 4 to 8 digits",yes:"OK",no:null});return;}
  if(v("sUpi")&&!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v("sUpi"))){ask({title:"Check the UPI ID",text:"It should look like name@bank.",yes:"OK",no:null});return;}
  if(!(ev>=0)||!(mn>=0)){ask({title:"Check the reward numbers",text:"Use whole numbers, like 3 and 300.",yes:"OK",no:null});return;}
  const staff=[...new Set(staffDraft.map(s=>s.trim().replace(/\s+/g," ")).filter(Boolean))];
  const next=pickShared(Object.assign({},cfg,{shop:v("sShop")||"Momos BC",upi:v("sUpi"),payee:v("sPayee"),ownerWa:v("sWa"),pin:v("sPin"),
    rewardEvery:ev,rewardMin:mn,billMsg:$("sMsg").value.trim(),staff}));
  const sharedChanged=JSON.stringify(next)!==JSON.stringify(pickShared(cfg));
  const linkChanged=v("sUrl")!==local.sheetUrl||v("sTok")!==local.token;
  local={sheetUrl:v("sUrl"),token:v("sTok")};S.set("local",local);
  closeLayer();
  if(linkChanged&&local.sheetUrl){
    // a newly connected device takes the shared settings from the Sheet
    cfgMeta={v:0,dirty:false};S.set("cfgMeta",cfgMeta);
    toast("Connecting to Google Sheet…");
    const r=await pullConfig();
    if(r==="error"||r==="offline")toast("Saved, but could not reach the Sheet. Check the URL, secret key and internet.",4000);
    else toast(r==="seeded"?"Connected. This device's settings are now the shared settings.":"Connected. Shared settings loaded from the Sheet.",4000);
    if(sharedChanged&&(r==="seeded"||r==="same"||r==="pushed")){cfg=next;await saveCfg();}
    else if(sharedChanged&&r==="loaded")ask({title:"Shared settings came from the Sheet",text:"Changes you made to shared settings were not applied, because this device was just connected. Open settings again to change them.",yes:"OK",no:null});
    syncPending();
  }else if(sharedChanged){
    cfg=next;toast(cfgResultMsg(await saveCfg(),"Settings"),3500);
  }else toast("Settings saved");
  if(isOpen("sumLayer"))loadSummary();
}

/* =========================================================
   PRICE EDITOR (owner)
   ========================================================= */
let priceDraft={},priceCat="momos";
function curPrice(k){return priceDraft[k]||PREF[k].price;}
function renderPrices(){
  const cell=(label,k)=>{const p=curPrice(k),b=PREF[k].base;
    return `<div class="pc">${label?`<span class="pl">${esc(label)}</span>`:""}`+[0,1].map(m=>`<label>${m?"🌙":"☀️"}<input type="tel" inputmode="numeric" maxlength="4" data-k="${esc(k)}" data-m="${m}" value="${isNaN(p[m])?"":p[m]}" class="${p[m]!==b[m]?"chg":""}" aria-label="${m?"Night":"Evening"} price"></label>`).join("")+`</div>`;};
  const items=MENU.filter(i=>i.cat===priceCat);
  $("priceBody").innerHTML=`<div class="ptabs">${CATS.map(c=>`<button class="tab${c.id===priceCat?" on":""}" data-pcat="${c.id}">${esc(c.name)}</button>`).join("")}</div>
    <p class="note" style="margin:0 4px 12px;color:var(--muted)">☀️ Evening price, 🌙 Night price. Yellow boxes differ from the printed menu.${local.sheetUrl?" Saved prices reach every device.":" Saved on this device only until the Google Sheet is connected."}</p>`+
    items.map(i=>i.price
      ?`<div class="pitem"><div class="prow"><span class="pn">${esc(i.name)}</span>${cell("",i.id+"||")}</div></div>`
      :`<div class="pitem"><h4>${i.no?i.no+". ":""}${esc(i.name)}</h4>${i.options.map(o=>`<div class="prow"><span class="pn">${esc(o.name)}</span>${o.sizes.map(s=>cell(s.name,i.id+"|"+o.key+"|"+s.name)).join("")}</div>`).join("")}</div>`).join("")+
    `<button class="act" id="pReset" style="width:100%;margin-top:6px">Reset all prices to the printed menu</button>`;
  $("pReset").onclick=async()=>{
    if(!await ask({title:"Reset all prices?",text:"Every item goes back to the printed menu price, on all devices.",yes:"Reset",no:"Cancel",danger:true}))return;
    priceDraft={};cfg=Object.assign({},cfg,{prices:{}});const r=await saveCfg();renderPrices();toast(cfgResultMsg(r,"Prices"),3500);
  };
}
$("priceBody").addEventListener("click",e=>{const t=e.target.closest("[data-pcat]");if(t){priceCat=t.dataset.pcat;renderPrices();$("priceBody").scrollTop=0;}});
$("priceBody").addEventListener("input",e=>{
  const i=e.target.closest("input[data-k]");if(!i)return;
  i.value=i.value.replace(/\D/g,"").slice(0,4);
  const k=i.dataset.k,m=+i.dataset.m,p=curPrice(k).slice();p[m]=i.value===""?NaN:+i.value;priceDraft[k]=p;
  i.classList.toggle("chg",p[m]!==PREF[k].base[m]);
});
$("priceSave").addEventListener("click",async()=>{
  const keys=Object.keys(priceDraft);
  if(!keys.length){closeLayer();return;}
  if(keys.some(k=>priceDraft[k].some(x=>!(x>0)))){ask({title:"Some prices are empty",text:"Every price must be ₹1 or more.",yes:"OK",no:null});return;}
  const map=Object.assign({},cfg.prices);
  keys.forEach(k=>{const p=priceDraft[k],b=PREF[k].base;if(p[0]===b[0]&&p[1]===b[1])delete map[k];else map[k]=p;});
  priceDraft={};cfg=Object.assign({},cfg,{prices:map});
  closeLayer();toast(cfgResultMsg(await saveCfg(),"Prices"),3500);
});

/* =========================================================
   START
   ========================================================= */
async function keepAwake(){try{if("wakeLock" in navigator&&document.visibilityState==="visible")await navigator.wakeLock.request("screen");}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;keepAwake();checkNudge();checkStaff();pullConfig();syncPending();});
setInterval(()=>{checkNudge();checkStaff();},60000);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});

if(!menu)$("chooser").classList.remove("hidden");
applyMenu();keepAwake();checkStaff();syncPending();pullConfig();
</script>
