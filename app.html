<!DOCTYPE html>
<html lang="en" data-theme="evening">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC21A">
<meta name="mobile-web-app-capable" content="yes">
<title>Momos BC</title>
<link rel="manifest" href="manifest.json">
<script src="firebase-config.js"></script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-firestore-compat.js"></script>
<link rel="icon" href="icon-192.png">
<style>
:root{
  --veg:#1E8E3E; --nonveg:#C62828; --yellow:#FFC21A; --ink:#151412;
  --radius-l:18px; --radius-m:12px; --radius-s:8px;
  font-family: Roboto, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
html[data-theme="evening"]{
  --bg:#FFF6DA; --surface:#FFFFFF; --surface-2:#FFEFBF; --text:#1B1A17; --muted:#6E654F;
  --line:#E8D9A8; --head-bg:#FFC21A; --head-text:#151412; --badge-bg:#151412; --badge-text:#FFC21A;
  --bar-bg:#151412; --bar-text:#FFFFFF; --bar-accent:#FFC21A; --tab-on-bg:#151412; --tab-on-text:#FFC21A;
  --btn-bg:#151412; --btn-text:#FFC21A; --shadow:0 2px 0 #E2CF92;
  color-scheme: light;
}
html[data-theme="night"]{
  --bg:#0A0F1F; --surface:#161E36; --surface-2:#212B4B; --text:#F4EFE2; --muted:#A7AFC8;
  --line:#2C3759; --head-bg:#03050C; --head-text:#FFC21A; --badge-bg:#FFC21A; --badge-text:#151412;
  --bar-bg:#FFC21A; --bar-text:#151412; --bar-accent:#151412; --tab-on-bg:#FFC21A; --tab-on-text:#151412;
  --btn-bg:#FFC21A; --btn-text:#151412; --shadow:0 2px 0 #050813;
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{overscroll-behavior-y:none}
.layer-body{overscroll-behavior:contain}
.pull-ind{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:95;background:#151412;color:#FFC21A;font-weight:800;padding:8px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.sync{font-size:13px;font-weight:700;opacity:.8;margin-left:6px}
.secnav{overflow-x:auto;scrollbar-width:none}.secnav::-webkit-scrollbar{display:none}
.secnav button{flex:1 0 auto;padding:0 14px;font-size:15px}
body.meal-mode .tprice{display:none}
body.meal-mode header.top{box-shadow:inset 0 -6px 0 #1FA855}
.cal{display:grid!important;grid-template-columns:auto 1fr;gap:4px 12px}
.cal .amts{text-align:right;white-space:nowrap}
.wcard .tap{cursor:pointer}
.chip.wa{background:#1FA855;color:#fff;border-color:#1FA855}
body{background:var(--bg);color:var(--text);font-size:17px;line-height:1.35;overscroll-behavior:none;touch-action:manipulation;
  padding-top:env(safe-area-inset-top,0px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;user-select:none;-webkit-user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid #2F7BFF;outline-offset:2px}
.hidden{display:none!important}
.dot{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-radius:3px;position:relative;flex:none;vertical-align:-2px}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.dot.v{color:var(--veg)} .dot.n{color:var(--nonveg)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--head-bg);color:var(--head-text);
  display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.brand{font-weight:900;font-style:italic;font-size:24px;letter-spacing:-.5px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;color:inherit;padding:4px 0;min-height:48px}
.brand small{display:block;font-size:13px;font-style:normal;font-weight:700;letter-spacing:0;opacity:.8;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
#sumBtn{position:relative}
.pend{position:absolute;top:-5px;right:-5px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#D32F2F;color:#fff;font-size:13px;font-weight:900;display:grid;place-items:center;font-style:normal}
.menu-badge{display:flex;align-items:center;gap:8px;background:var(--badge-bg);color:var(--badge-text);
  border-radius:999px;padding:8px 14px 8px 10px;font-weight:800;font-size:17px;min-height:48px}
.menu-badge .ico{font-size:24px;line-height:1}
.menu-badge .chg{font-size:12px;font-weight:600;opacity:.8;display:block;line-height:1}
.icon-btn{min-width:48px;min-height:48px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:rgba(127,127,127,.18);color:var(--head-text)}

.nudge{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#B3261E;color:#fff;font-weight:600}
.nudge span{flex:1}
.nudge button{background:#fff;color:#B3261E;border-radius:10px;padding:10px 14px;font-weight:800}

/* ---------- tabs ---------- */
nav.tabs{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:15;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:48px;padding:0 18px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:16px;white-space:nowrap}
.tab.on{background:var(--tab-on-bg);color:var(--tab-on-text);border-color:var(--tab-on-bg)}

/* ---------- grid ---------- */
main{padding:12px 12px 120px}
.group-title{font-weight:800;font-size:15px;color:var(--muted);margin:14px 4px 8px}
.group-title:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
@media (min-width:900px){.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
.tile{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-l);box-shadow:var(--shadow);min-height:104px;display:flex}
.tile.has{border-color:var(--yellow);border-width:3px}
.tile-add{flex:1;text-align:left;padding:12px 12px 12px 14px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;border-radius:var(--radius-l)}
.tile-add:active{background:var(--surface-2)}
.tname{font-weight:800;font-size:17px;line-height:1.2;display:flex;gap:8px;align-items:flex-start}
.tname .no{flex:none;width:28px;height:28px;border-radius:50%;background:var(--yellow);color:#151412;font-size:14px;display:grid;place-items:center;font-weight:900}
.tname .dot{margin-top:3px}
.tprice{font-weight:800;font-size:18px}
.tprice small{font-weight:600;font-size:13px;color:var(--muted)}
.tqty{position:absolute;top:-10px;right:-8px;min-width:34px;height:34px;padding:0 8px;border-radius:999px;background:var(--yellow);color:#151412;font-weight:900;font-size:17px;display:grid;place-items:center;border:3px solid var(--bg);pointer-events:none}
.tile-minus{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:12px;background:var(--surface-2);font-size:26px;font-weight:800;line-height:1}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
.bar button{width:100%;min-height:68px;border-radius:var(--radius-l);background:var(--bar-bg);color:var(--bar-text);display:flex;align-items:center;gap:12px;padding:0 18px;font-size:18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bar .cnt{background:var(--bar-accent);color:var(--bar-bg);border-radius:999px;padding:4px 12px;font-weight:900}
.bar .amt{flex:1;text-align:left;font-size:24px;font-weight:900}
.bar .go{font-weight:800}
.bar button:disabled{opacity:.55;justify-content:center;font-weight:600;font-size:16px}

/* ---------- layers ---------- */
.layer{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.layer-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--head-bg);color:var(--head-text);min-height:68px}
.layer-head h2{margin:0;font-size:21px;font-weight:900;flex:1}
.back-btn{min-height:48px;padding:0 14px;border-radius:12px;background:rgba(127,127,127,.2);font-weight:800;color:var(--head-text)}
.layer-body{flex:1;overflow-y:auto;padding:14px 12px 24px}
.layer-foot{padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}

/* bill */
.bill-wrap{display:grid;gap:14px;max-width:1100px;margin:0 auto;grid-template-areas:"qr" "mobile" "items"}
.b-items{grid-area:items}.b-mobile{grid-area:mobile}.b-qr{grid-area:qr}
@media (min-width:820px){.bill-wrap{grid-template-columns:1.15fr 1fr;grid-template-areas:"items qr" "mobile qr";align-items:start}.b-qr{position:sticky;top:0}}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-l);padding:14px}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line .ln{font-weight:700;display:flex;gap:8px;align-items:flex-start}
.line .ln .dot{margin-top:4px}
.line .la{font-weight:900;font-size:18px;text-align:right}
.line .lp{color:var(--muted);font-size:15px}
.stepper{display:flex;align-items:center;gap:6px;justify-self:end}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--surface-2);font-size:24px;font-weight:900}
.stepper b{min-width:30px;text-align:center;font-size:19px}
.grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding-top:12px;border-top:3px solid var(--text)}
.grand span{font-weight:800;font-size:18px}
.grand b{font-size:38px;font-weight:900;letter-spacing:-1px}
.qr-box{background:#fff;color:#151412;border-radius:var(--radius-l);padding:14px;text-align:center;border:4px solid var(--yellow)}
.qr-box .qr{width:min(62vw,260px);margin:0 auto}
@media (min-width:820px){.qr-box .qr{width:min(34vw,320px)}}
.qr-box .qr svg{width:100%;height:auto;display:block}
.qr-box .pay-amt{font-size:30px;font-weight:900;margin:6px 0 2px}
.qr-box .pay-to{font-size:14px;color:#555}
.qr-missing{padding:28px 10px;color:#555;font-weight:600}
.field label{display:block;font-weight:800;margin-bottom:6px}
.field input{width:100%;min-height:58px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 14px;font-size:22px;font-weight:700;letter-spacing:1px}
.field .hint{min-height:22px;margin-top:6px;font-weight:700;font-size:15px}
.hint.ok{color:var(--veg)} .hint.warn{color:#D9480F} .hint.info{color:var(--muted)}
.wa-btn{width:100%;min-height:54px;border-radius:14px;background:#1FA855;color:#fff;font-weight:800;font-size:17px;margin-top:10px}
.pay-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay-btn{min-height:72px;border-radius:var(--radius-l);font-size:20px;font-weight:900;color:#fff}
.pay-btn small{display:block;font-size:13px;font-weight:600;opacity:.9}
.pay-upi{background:#5B2BC9} .pay-cash{background:#1E7B34}
.cancel-btn{width:100%;min-height:48px;margin-top:8px;border-radius:14px;color:#D32F2F;font-weight:800;border:2px solid currentColor}
html[data-theme="night"] .cancel-btn{color:#FF7B7B}

/* option sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:92vh;background:var(--bg);border-radius:22px 22px 0 0;display:flex;flex-direction:column;animation:up .18s ease-out}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:16px 14px 10px}
.sheet-head h3{margin:0;font-size:22px;font-weight:900;flex:1;display:flex;gap:10px;align-items:center}
.sheet-head .no{width:34px;height:34px;border-radius:50%;background:var(--yellow);color:#151412;display:grid;place-items:center;font-size:16px;flex:none}
.close-x{width:48px;height:48px;border-radius:14px;background:var(--surface-2);font-size:24px;font-weight:800}
.sheet-body{overflow-y:auto;padding:4px 14px 10px}
.orow{display:grid;grid-template-columns:minmax(120px,1fr) auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.orow:last-child{border-bottom:0}
.oname{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:flex-start;line-height:1.2}
.oname .dot{margin-top:3px}
.osizes{display:flex;gap:8px}
.sz{position:relative}
.sz-add{min-width:104px;min-height:62px;border-radius:14px;background:var(--surface);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted)}
.sz-add b{font-size:19px;color:var(--text);font-weight:900}
.sz-add:active{background:var(--surface-2)}
.sz.has .sz-add{border-color:var(--yellow);border-width:3px}
.sz .tqty{top:-9px;right:-6px;min-width:30px;height:30px;font-size:15px}
.sz-minus{position:absolute;bottom:-8px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--text);color:var(--bg);font-size:22px;font-weight:900;line-height:1}
@media (max-width:380px){.orow{grid-template-columns:1fr}.osizes{justify-content:flex-end}}
.sheet-foot{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.big-btn{width:100%;min-height:64px;border-radius:var(--radius-l);background:var(--btn-bg);color:var(--btn-text);font-size:19px;font-weight:900}

/* modal */
.modal-scrim{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:18px}
.modal{width:100%;max-width:440px;background:var(--surface);color:var(--text);border-radius:22px;padding:22px 18px 18px}
.modal h3{margin:0 0 8px;font-size:23px;font-weight:900}
.modal p{margin:0 0 18px;font-size:18px;color:var(--muted);white-space:pre-line}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .row.one{grid-template-columns:1fr}
.m-no{min-height:60px;border-radius:16px;background:var(--surface-2);font-weight:800;font-size:18px}
.m-yes{min-height:60px;border-radius:16px;background:var(--btn-bg);color:var(--btn-text);font-weight:900;font-size:18px}
.m-yes.danger{background:#C62828;color:#fff}

/* toast */
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:90;background:#151412;color:#fff;padding:14px 20px;border-radius:14px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);max-width:92vw;text-align:center}
html[data-theme="night"] .toast{background:#F4EFE2;color:#151412}

/* chooser */
.chooser{position:fixed;inset:0;z-index:80;background:#151412;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.chooser h1{margin:0;font-style:italic;font-weight:900;font-size:38px;color:#FFC21A;letter-spacing:-1px}
.chooser p{margin:0 0 6px;color:#cfc8b6;font-size:18px}
.choice{width:min(100%,460px);min-height:130px;border-radius:24px;display:flex;align-items:center;gap:18px;padding:18px 22px;text-align:left}
.choice .big{font-size:52px;line-height:1}
.choice b{display:block;font-size:28px;font-weight:900}
.choice span{font-size:17px;font-weight:600;opacity:.8}
.choice.ev{background:#FFF6DA;color:#151412;border:4px solid #FFC21A}
.choice.nt{background:#0A0F1F;color:#F4EFE2;border:4px solid #3A4A7A}

/* identity banner, section switch */
.banner{background:#B3261E;color:#fff;font-weight:700;padding:10px 14px;font-size:15px}
.secnav{display:flex;gap:8px;padding:10px 12px 0;background:var(--bg)}
.secnav button{flex:1;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:800;font-size:16px}
.secnav button.on{background:var(--tab-on-bg);color:var(--tab-on-text);border-color:var(--tab-on-bg)}
.view{padding:14px 12px 40px;max-width:760px;margin:0 auto}
.owntabs{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--line);scrollbar-width:none;flex:none}
.owntabs::-webkit-scrollbar{display:none}

/* attendance */
.att-card{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;text-align:center}
.att-card .who{font-size:15px;font-weight:700;color:var(--muted)}
.att-card .state{font-size:26px;font-weight:900;margin:6px 0 2px}
.att-card .sub{color:var(--muted);font-weight:600}
.punch{width:100%;min-height:84px;border-radius:20px;font-size:24px;font-weight:900;color:#fff;margin-top:16px}
.punch.in{background:#1E7B34}.punch.out{background:#C62828}.punch:disabled{opacity:.6}
.linkbtn{background:none;color:var(--text);text-decoration:underline;font-weight:700;min-height:48px;padding:0 6px;margin-top:6px}
.flag{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#FDE2E1;color:#8A1C14;margin:2px 4px 0 0}
.flag.ok{background:#DCF3E3;color:#14532D}
.flag.info{background:var(--surface-2);color:var(--text)}

/* owner tables and forms */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
.tbl th{color:var(--muted);font-size:12px;font-weight:800}
.tbl td.num,.tbl th.num{text-align:right}
.scroll-x{overflow-x:auto;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px 10px}
.wcard{width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:block}
.wcard .top{display:flex;justify-content:space-between;gap:10px;font-weight:900;font-size:17px}
.wcard .meta{color:var(--muted);font-weight:600;font-size:14px;margin-top:4px;white-space:normal}
.chk{display:flex;align-items:center;gap:12px;min-height:52px;font-weight:800;font-size:17px}
.chk input{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px}
.row2 input{min-height:50px!important;font-size:17px!important}
.chipset{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.codechip{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:6px 6px 6px 12px;font-weight:900;letter-spacing:2px}
.codechip button{width:34px;height:34px;border-radius:50%;background:var(--surface);font-weight:900;letter-spacing:0}
.big-num{font-size:30px;font-weight:900}

/* stock */
.st-sec{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:6px 14px;margin-bottom:12px}
.st-sec h3{margin:8px 0 4px;font-size:18px;font-weight:900}
.st-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.st-row:first-of-type{border-top:0}
.st-row .nm{flex:1;font-weight:800;font-size:16px}
.st-row .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px}
.st-step{display:flex;align-items:center;gap:6px}
.st-step button{width:46px;height:46px;border-radius:12px;background:var(--surface-2);font-size:24px;font-weight:900}
.st-step input{width:70px;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg);text-align:center;font-size:19px;font-weight:900}
.yn{display:flex;gap:8px}
.yn button{width:64px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:20px;font-weight:900}
.yn button.on.y{background:#1E7B34;color:#fff;border-color:#1E7B34}
.yn button.on.n{background:#9E9E9E;color:#fff;border-color:#9E9E9E}
.sec-edit{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}
.sec-edit .hdr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sec-edit .hdr input{flex:1}
.mini{width:44px;height:44px;border-radius:10px;background:var(--surface-2);font-weight:900;font-size:17px;flex:none}
.sec-edit select,.field select{min-height:50px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:16px;font-weight:700;padding:0 8px;color:var(--text)}

/* Firebase version */
.signin{position:fixed;inset:0;z-index:95;background:#151412;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));overflow-y:auto;text-align:center}
.signin h1{margin:0;font-style:italic;font-weight:900;font-size:36px;color:#FFC21A}
.signin p{margin:0;color:#cfc8b6;font-size:17px}
.si-card{width:min(100%,420px);background:#FFF6DA;color:#151412;border-radius:22px;padding:20px;text-align:left}
.si-card .state{font-size:22px;font-weight:900;margin-bottom:6px}.si-card .sub{color:#5f574a;margin:0 0 14px}
.si-card .field input{background:#fff;color:#151412}
.view-btn{min-height:48px;border-radius:14px;padding:0 10px;font-weight:800;font-size:14px;background:rgba(127,127,127,.18);color:var(--head-text)}
.b2b-foot{position:sticky;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding:12px 2px calc(12px + env(safe-area-inset-bottom,0px));margin-top:8px}
details.cyc{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:10px}
details.cyc summary{display:flex;justify-content:space-between;gap:10px;padding:10px 0;font-weight:800;cursor:pointer;list-style:none}
details.cyc summary::-webkit-details-marker{display:none}
details.cyc .list{border:0;padding:0;margin-bottom:8px}

/* staff picker */
.staff-pick{position:fixed;inset:0;z-index:85;background:#151412;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));overflow-y:auto}
.staff-pick h1{margin:0;font-size:30px;font-weight:900;color:#FFC21A;text-align:center}
.staff-pick p{margin:0;color:#cfc8b6;font-size:18px}
.staff-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(100%,640px)}
.staff-btn{min-height:84px;border-radius:20px;background:#FFF6DA;color:#151412;font-size:22px;font-weight:900;border:4px solid #FFC21A;padding:8px}
.staff-cancel{color:#cfc8b6;font-weight:700;min-height:48px;padding:0 24px;border:2px solid #555;border-radius:14px}

/* summary */
.datebar{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:14px}
.datebar button{width:52px;height:52px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:900}
.datebar b{font-size:20px;min-width:170px;text-align:center}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .k{font-size:14px;font-weight:700;color:var(--muted)}
.stat .v{font-size:24px;font-weight:900}
.stat .s{font-size:14px;color:var(--muted);font-weight:600}
.stat.wide{grid-column:1/-1}
.stat.wide .v{font-size:40px;letter-spacing:-1px}
.sec{margin:20px 4px 8px;font-size:17px;font-weight:900}
.list{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:4px 14px}
.li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-weight:600}
.li:last-child{border-bottom:0}
.li .m{color:var(--muted);font-size:14px}
.li>b,.li>span:last-child{white-space:nowrap}
.actions{display:grid;gap:10px;margin-top:16px}
.act{min-height:58px;border-radius:16px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:17px}
.act.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.act.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-text)}
.status{padding:12px 14px;border-radius:14px;font-weight:700;background:var(--surface-2);margin-top:14px}
.status.bad{background:#FDE2E1;color:#8A1C14}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-weight:600}
.loading{padding:40px 10px;text-align:center;font-weight:700;color:var(--muted);font-size:18px}
button.li{width:100%;text-align:left;border-radius:0;background:none}
.li.void{opacity:.6}.li.void .amt{text-decoration:line-through}
.status .act{margin-top:10px;width:100%}
.info{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 6px}
.info dt{color:var(--muted);font-weight:700}.info dd{margin:0;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.chip{min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:800}
.chip.on{background:var(--btn-bg);color:var(--btn-text);border-color:var(--btn-bg)}
.staff-row{display:flex;gap:8px;margin-bottom:8px}.staff-row input{flex:1}
.staff-row button{width:56px;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:900}
.devcode{font-size:26px;font-weight:900;letter-spacing:4px}
.form .sec{margin:10px 0 0;font-size:19px}

/* settings */
.form{display:grid;gap:14px;max-width:640px;margin:0 auto}
.form .field input{font-size:18px;letter-spacing:0}
.form .note{font-size:14px;color:var(--muted);margin-top:4px}
.field textarea{width:100%;min-height:170px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:12px 14px;font-size:16px;line-height:1.4;resize:vertical}
.reward{margin-top:10px;padding:12px 14px;border-radius:14px;background:#FFF1C9;color:#4A3500;font-weight:700;border:2px dashed #E0A800}
html[data-theme="night"] .reward{background:#3A2E05;color:#FFE7A0;border-color:#FFC21A}
.reward button{display:block;width:100%;margin-top:10px;min-height:52px;border-radius:12px;background:#E0A800;color:#151412;font-weight:900;font-size:17px}
.stat .v.sm{font-size:18px;line-height:1.25}
.li .r{text-align:right;white-space:nowrap}
.ptabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;scrollbar-width:none}
.pitem{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.pitem h4{margin:0 0 6px;font-size:17px;font-weight:900}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .pn{flex:1 1 130px;font-weight:700}
.pc{display:flex;align-items:center;gap:6px}
.pc .pl{font-size:13px;color:var(--muted);font-weight:700;min-width:34px}
.pc label{display:flex;align-items:center;gap:3px;font-size:16px}
.pc input{width:74px;min-height:46px;border-radius:10px;border:2px solid var(--line);background:var(--bg);text-align:center;font-size:17px;font-weight:800}
.pc input.chg{border-color:#E0A800;background:#FFF1C9;color:#151412}
</style>
</head>
<body>

<header class="top">
  <button class="brand" id="brand" aria-label="Change staff"><span id="brandName">Momos BC</span><small id="brandSub"></small></button>
  <button class="menu-badge" id="menuBadge" aria-label="Change menu"><span class="ico" id="menuIco">☀️</span><span><span id="menuName">Evening</span><span class="chg">Tap to change</span></span></button>
  <button class="icon-btn" id="sumBtn" aria-label="Sales summary">📊<span class="pend hidden" id="pend"></span></button>
  <button class="view-btn hidden" id="viewBtn" aria-label="Switch view">🏪 Outlet ▾</button>
  <button class="icon-btn hidden" id="ownBtn" aria-label="Owner">🔒</button>
</header>
<div class="banner hidden" id="banner"></div>
<nav class="secnav hidden" id="secNav"></nav>
<div class="nudge hidden" id="nudge"><span id="nudgeText"></span><button id="nudgeBtn">Switch</button></div>
<nav class="tabs" id="tabs"></nav>
<main id="grid"></main>
<main id="attView" class="view hidden"></main>
<main id="advView" class="view hidden"></main>
<main id="stockView" class="view hidden"></main>
<main id="b2bView" class="view hidden"></main>
<main id="meView" class="view hidden"></main>
<div class="view hidden" id="mgrHome"><div class="att-card"><div class="state">📋 Manager</div><p class="sub">Sales, targets, insights, staff, attendance, advances, meals, stock and B2B, read-only.</p><button class="big-btn" id="mgrHomeBtn">Open</button></div></div>

<div class="bar"><button id="barBtn" disabled></button></div>

<!-- Bill -->
<section class="layer hidden" id="billLayer" aria-label="Bill">
  <div class="layer-head"><button class="back-btn" data-close>← Add items</button><h2>Bill <span id="billMenu" style="font-size:16px;opacity:.85"></span></h2></div>
  <div class="layer-body">
    <div class="bill-wrap">
        <div class="card b-items"><div id="billLines"></div>
          <div class="grand"><span>Grand total</span><b id="billTotal">₹0</b></div>
        </div>
        <div class="card field b-mobile">
          <label for="mobile">Customer mobile</label>
          <input id="mobile" type="tel" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="10-digit number">
          <div class="hint" id="mobileHint"></div>
          <div class="reward hidden" id="rewardBox"></div>
          <button class="wa-btn hidden" id="waBillBtn">Send bill on WhatsApp</button>
        </div>
      <div class="qr-box b-qr" id="qrBox"></div>
    </div>
  </div>
  <div class="layer-foot">
    <div class="pay-row">
      <button class="pay-btn pay-upi" id="payUpi">Paid by UPI<small>Scanned QR</small></button>
      <button class="pay-btn pay-cash" id="payCash">Paid by Cash<small>Cash received</small></button>
    </div>
    <button class="cancel-btn" id="cancelBill">Cancel bill</button>
  </div>
</section>

<!-- Summary -->
<section class="layer hidden" id="sumLayer" aria-label="Sales summary">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2>Sales summary</h2></div>
  <div class="layer-body" id="sumBody"></div>
</section>

<!-- Owner area -->
<section class="layer hidden" id="ownLayer" aria-label="Owner">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2>🔒 Owner <span class="sync hidden" id="ownSync">⟳ syncing</span></h2></div>
  <nav class="owntabs hidden" id="ownTabs"></nav>
  <div class="layer-body" id="ownBody"></div>
</section>

<!-- Sub-forms (profile, correction, advance, payroll detail, stock week) -->
<section class="layer hidden" id="formLayer" aria-label="Details">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2 id="formTitle"></h2></div>
  <div class="layer-body" id="formBody"></div>
  <div class="layer-foot hidden" id="formFoot"></div>
</section>

<!-- Bill detail -->
<section class="layer hidden" id="detLayer" aria-label="Bill details">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2 id="detTitle">Bill</h2></div>
  <div class="layer-body" id="detBody"></div>
</section>

<!-- Settings -->
<section class="layer hidden" id="setLayer" aria-label="Settings">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2>Owner settings</h2></div>
  <div class="layer-body" id="setBody"></div>
</section>

<!-- Prices -->
<section class="layer hidden" id="priceLayer" aria-label="Edit prices">
  <div class="layer-head"><button class="back-btn" data-close>← Back</button><h2>Edit prices</h2></div>
  <div class="layer-body" id="priceBody"></div>
  <div class="layer-foot"><button class="big-btn" id="priceSave">Save prices</button></div>
</section>

<!-- Option sheet -->
<div class="scrim hidden" id="optScrim"><div class="sheet" role="dialog" aria-modal="true">
  <div class="sheet-head"><h3 id="optTitle"></h3><button class="close-x" id="optClose" aria-label="Close">✕</button></div>
  <div class="sheet-body" id="optBody"></div>
  <div class="sheet-foot"><button class="big-btn" id="optDone">Done</button></div>
</div></div>

<!-- Modal -->
<div class="modal-scrim hidden" id="modal"><div class="modal" role="alertdialog" aria-modal="true">
  <h3 id="mTitle"></h3><p id="mText"></p>
  <div class="row" id="mRow"><button class="m-no" id="mNo">No</button><button class="m-yes" id="mYes">Yes</button></div>
</div></div>

<!-- Chooser -->
<div class="chooser hidden" id="chooser">
  <h1 id="chooserBrand">Momos BC</h1>
  <p>Choose the menu to start billing</p>
  <button class="choice ev" data-menu="evening"><span class="big">☀️</span><span><b>Evening menu</b><span>6:00 PM – 12:00 AM</span></span></button>
  <button class="choice nt" data-menu="night"><span class="big">🌙</span><span><b>Night menu</b><span>12:00 AM – 6:00 AM</span></span></button>
</div>

<!-- Staff picker -->
<div class="staff-pick hidden" id="staffPick">
  <h1 id="staffTitle">Who is billing today?</h1>
  <p id="staffSub">Tap your name</p>
  <div class="staff-list" id="staffList"></div>
  <button class="staff-cancel hidden" id="staffCancel">Cancel</button>
</div>

<div class="signin hidden" id="signIn"></div>
<div class="toast hidden" id="toast"></div>
<div class="pull-ind hidden" id="pullInd"></div>
<input type="file" id="restoreFile" accept="application/json,.json" class="hidden">

/* ---------- uploading entries (every write can safely repeat: nothing is ever counted twice) ---------- */
function billPublic(b){
  return {id:b.id,seq:b.seq||0,device:b.device||"",local:b.local,bdate:b.bdate,menu:b.menu,staff:b.staff||"",staffId:b.staffId||"",byId:b.byId||"",
    lines:(b.lines||[]).map(l=>({n:l.n||l.item,item:l.item,cat:catOf(l),opt:l.opt||"",size:l.size||"",price:l.price,qty:l.qty,free:!!l.free})),
    count:b.count,total:b.total,mode:b.mode,hasMobile:!!b.mobile,m4:b.mobile?String(b.mobile).slice(-4):"",visit:b.visit||0,reward:!!b.reward,
    status:b.status||"",voidReason:b.voidReason||""};
}
function billWrites(batch,b){
  const until=untilFor(b.bdate);
  batch.set(D("days/"+b.bdate),{bills:FV().arrayUnion(billPublic(b)),until},{merge:true});
  batch.set(D("dayTotals/"+b.bdate),{t:{[b.id]:b.status==="Voided"?0:Number(b.total)||0},until},{merge:true});
  if(b.mobile&&validMobile(b.mobile)){
    batch.set(D("contacts/"+b.bdate),{m:{[b.id]:b.mobile},until},{merge:true});
    if(b.status!=="Voided")batch.set(D("customers/"+b.mobile),{bills:{[b.id]:b.bdate}},{merge:true});
  }
}
let syncPromise=null,lastSyncError="";
function pendingCount(){return bills.filter(b=>!b.fbSynced).length;}
function syncPending(){if(!syncPromise)syncPromise=doSync().finally(()=>{syncPromise=null;});return syncPromise;}
async function doSync(){
  if(fbReady()&&me.status==="active"&&navigator.onLine){
    const pending=bills.filter(b=>!b.fbSynced);
    for(let i=0;i<pending.length;i+=20){
      const part=pending.slice(i,i+20),batch=db.batch();part.forEach(b=>billWrites(batch,b));
      try{await withTimeoutP(batch.commit(),25000);part.forEach(b=>{b.fbSynced=true;});S.set("bills",bills);lastSyncError="";}
      catch(e){lastSyncError=e.message||"Could not reach Firebase";break;}
    }
    if(pending.length)updateBand(businessDate(new Date()));
  }else if(!navigator.onLine)lastSyncError="No internet";
  if(platform.liveCopy)await mirrorBillsToSheet();
  renderHeader();
}
async function remoteVisits(m){
  if(!fbReady()||!navigator.onLine)return null;
  try{const s=await withTimeoutP(D("customers/"+m).get(),5000);return s.exists?Object.keys((s.data().bills)||{}).length:0;}catch(e){return null;}
}

/* daily target levels: workers see which target levels were reached, never the exact sales */
async function updateBand(bdate){
  try{
    const ladder=(cfg.ladder||[]).slice().sort((a,b)=>a-b);if(!ladder.length)return;
    const s=await D("dayTotals/"+bdate).get();if(!s.exists)return;
    const t=Object.values(s.data().t||{}).reduce((a,x)=>a+(Number(x)||0),0);
    let lvl=0;ladder.forEach(x=>{if(t>=x)lvl=x;});
    if(lvl)await D("bands/"+monthOf(bdate)).set({d:{[bdate]:lvl}},{merge:true});
  }catch(e){}
}

function sheetLink(params,base,token){

}
async function withTimeout(ms,fn){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{return await fn(c.signal);}
  catch(e){if(e.name==="AbortError")throw new Error("The Google Sheet took too long to answer");throw e;}
  finally{clearTimeout(t);}
}
const sheetGet=(params,ms=12000)=>withTimeout(ms,async sig=>(await fetch(sheetLink(params),{signal:sig})).json());
const sheetPost=(body,ms=25000)=>withTimeout(ms,async sig=>(await fetch(local.sheetUrl,{method:"POST",signal:sig,
  headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({token:local.token},body))})).json());
function payloadBill(b){
  return {id:b.id,device:b.device,local:b.local,bdate:b.bdate,menu:b.menu,staff:b.staff||"",
    lines:b.lines.map(l=>Object.assign({},l,{cat:catOf(l),plates:platesOf(l)})),

    status:b.status||"",voidReason:b.voidReason||"",voidedAt:b.voidedAt||""};
}
async function mirrorBillsToSheet(){
  if(!local.sheetUrl||!navigator.onLine)return;
  const pend=bills.filter(b=>!b.synced);if(!pend.length)return;
  try{for(let i=0;i<pend.length;i+=25){const part=pend.slice(i,i+25),d=await sheetPost({bills:part.map(payloadBill)});
    if(!d.ok)return;const ok=new Set(d.saved||[]);part.forEach(b=>{if(ok.has(b.id))b.synced=true;});S.set("bills",bills);}}catch(e){}
}
async function mirror(kind,rows){
  if(!platform.liveCopy||!local.sheetUrl||!rows.length)return;
  try{await sheetPost({action:"mirror",kind,rows});}catch(e){}
}

function showSignIn(state,extra){

  if(state==="admin"){

      <div class="hint warn" id="siHint"></div>
      <button class="big-btn" id="siGo">Sign in as admin</button><button class="linkbtn" id="siBack">Back</button></div>`;
    $("siBack").onclick=()=>showSignIn(auth&&auth.currentUser?"pending":"out");
    $("siGo").onclick=async()=>{

      try{

        F.set("adminPhone",$("siKeep").checked);
        await auth.signInWithEmailAndPassword($("siEmail").value.trim(),$("siPw").value);
      }catch(e){h.textContent=/password|credential|user-not-found|invalid/i.test(e.code+e.message)?"Wrong email or password":e.message;$("siGo").disabled=false;$("siGo").textContent="Sign in as admin";}
    };
    return;
  }
  if(state==="pending"){
    box.innerHTML=`<h1>${esc(cfg.shop)}</h1>
      <div class="si-card"><div class="state">Ask the owner to give you access</div>
      <p class="sub">You're signed in as <b>${esc(extra||"")}</b>. The owner approves new sign-ins once; after that the app opens as usual.</p>
      <button class="big-btn" id="siCheck">Check again</button><button class="linkbtn" id="siOut">Use a different account</button></div>${adminLink}`;
    $("siCheck").onclick=()=>location.reload();
  }else if(state==="paused"){
    box.innerHTML=`<h1>${esc(cfg.shop)}</h1><div class="si-card"><div class="state">Your access is paused</div>
      <p class="sub">Speak to the owner.</p><button class="linkbtn" id="siOut">Sign out</button></div>${adminLink}`;
  }else if(state==="connected"){
    box.innerHTML=`<h1>${esc(cfg.shop)}</h1><div class="si-card"><div class="state">✓ Google account connected</div>
      <p class="sub">${esc(extra||"")}</p><button class="big-btn" id="siBackApp">Back to the app</button></div>`;
    $("siBackApp").onclick=()=>{S.set("fbConnected",true);location.replace("index.html?stay=1");};
    return;
  }else{
    box.innerHTML=`<h1>${esc(cfg.shop)}</h1><p>${CONNECT?"Connect your Google account (one time)":"Sign in to continue"}</p>
      <div class="si-card"><button class="big-btn" id="siGoogle">Sign in with Google</button><div class="hint warn" id="siHint"></div></div>${adminLink}
      ${CONNECT?`<button class="linkbtn" id="siSkip" style="color:#cfc8b6">Not now</button>`:""}`;
    $("siGoogle").onclick=async()=>{
      try{await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});await auth.signInWithPopup(p);}
      catch(e){if(/popup-blocked|operation-not-supported/.test(e.code||"")){try{await auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider());}catch(e2){$("siHint").textContent=e2.message;}}
        else if(!/popup-closed|cancelled-popup/.test(e.code||""))$("siHint").textContent=e.message;}
    };
    if($("siSkip"))$("siSkip").onclick=()=>location.replace("index.html?stay=1");
  }
  if($("siOut"))$("siOut").onclick=()=>auth.signOut();
  if($("siAdmin"))$("siAdmin").onclick=()=>showSignIn("admin");
}
function hideSignIn(){$("signIn").classList.add("hidden");}
async function onAuth(user){
  if(userUnsub){userUnsub();userUnsub=null;}
  if(!user){me=Object.assign({},NOBODY,{status:"out"});F.set("me",me);renderHeader();showSignIn("out");return;}
  let claims={};try{claims=(await user.getIdTokenResult()).claims||{};}catch(e){}
  const provider=claims.firebase&&claims.firebase.sign_in_provider;
  if(provider==="password"&&(!FBC.adminEmail||String(claims.email||user.email).toLowerCase()===FBC.adminEmail.toLowerCase())){
    me={status:"active",uid:user.uid,name:"Owner",staffId:"",views:["outlet","kitchen","manager"],access:{billing:true,stock:true},admin:true,slabs:[]};
    F.set("me",me);hideSignIn();identityReady();return;
  }
  const ref=D("users/"+user.uid);
  userUnsub=ref.onSnapshot(async snap=>{
    if(!snap.exists){
      try{await ref.set({email:user.email||"",gname:user.displayName||"",status:"pending",requestedAt:TS().now()});}catch(e){}
      me=Object.assign({},NOBODY,{status:"pending",uid:user.uid});F.set("me",me);
      if(CONNECT)showSignIn("connected","The owner will approve you. Keep using the app as usual.");else showSignIn("pending",user.email);
      renderHeader();return;
    }
    const u=snap.data(),st=staffById(u.staffId);
    me={status:u.status||"pending",uid:user.uid,name:st?st.name:(u.gname||""),staffId:u.staffId||"",views:u.views||[],access:u.access||{},admin:false,slabs:u.slabs||[],email:u.email||""};
    F.set("me",me);
    if(CONNECT){showSignIn("connected",me.status==="active"?"You're already approved.":"The owner will approve you. Keep using the app as usual.");return;}
    if(me.status==="paused"){showSignIn("paused");renderHeader();return;}
    if(me.status!=="active"){showSignIn("pending",user.email);renderHeader();return;}
    hideSignIn();identityReady();
  },()=>{ if(me.status==="active")identityReady(); });
}

  listenShared();checkStaff();renderHeader();
  if(!started){started=true;openSection(curSection);syncPending();syncPunches();syncMeals();

}

  if(!m){h.className="hint";h.textContent="";return;}
  if(m.length<10){h.className="hint info";h.textContent=(10-m.length)+" more digit"+(10-m.length>1?"s":"");return;}
  if(!validMobile(m)){h.className="hint warn";h.textContent="Check the number (should start with 6, 7, 8 or 9)";return;}
  showVisits(Math.max(localVisits(m),remoteCache[m]||0));
  if(remoteCache[m]!==undefined)return;
  const seq=++lookupSeq;
  remoteVisits(m).then(n=>{if(n==null)return;remoteCache[m]=n;if(seq===lookupSeq&&mobile===m)showVisits(Math.max(n,localVisits(m)));});
}

async function pay(mode){
  if(!cart.length)return;
  if(cfg.staff.length&&!currentStaff()){showStaffPicker(false);return;}
  if(cart.some(l=>l.free)&&!rewardOK()){
    if(await ask({title:"Remove the free Mojito?",text:`It is only for every ${ordinal(every())} visit of a customer whose mobile number is entered, on orders of ${rs(+cfg.rewardMin)} or more.`,yes:"Remove it",no:"Go back"})){
      cart=cart.filter(l=>!l.free);saveCart();renderBill();renderBar();}
    return;
  }
  const t=cartTotal();
  let note="";
  if(mobile&&!validMobile(mobile))note="\nThe mobile number looks incomplete, so it will not be saved.";
  const ok=await ask({title:(mode==="UPI"?"UPI payment received?":"Cash received?"),text:`${rs(t)} by ${mode==="UPI"?"UPI":"cash"}.${note}`,yes:"Yes, save bill",no:"Not yet"});
  if(!ok)return;
  const now=new Date(),bd=businessDate(now);
  const seq=bills.filter(b=>b.bdate===bd&&b.device===device).reduce((a,b)=>Math.max(a,b.seq||0),0)+1;
  const okMob=validMobile(mobile);
  const bill={
    id:device+bd.replace(/-/g,"").slice(2)+"-"+String(seq).padStart(3,"0"),
    seq,device,ts:now.toISOString(),local:localStamp(now),bdate:bd,menu,staff:currentStaff(),
    lines:cart.map(l=>({n:lineName(l),item:l.name,cat:catOf(l),opt:l.opt,size:l.size,price:l.price,qty:l.qty,free:!!l.free})),
    count:cartCount(),total:t,mode,mobile:okMob?mobile:"",visit:okMob?visitNo:0,reward:cart.some(l=>l.free),
    staffId:(staffByName(currentStaff())||{}).id||"",byId:me.admin?"admin":me.staffId,fbSynced:false,
    status:"",voidReason:"",synced:false
  };
  bills.push(bill);
  if(!S.set("bills",bills))toast("Warning: this device could not save the bill",4000);
  clearVisitCache();
  cart=[];mobile="";saveCart();
  closeLayer();renderGrid();renderBar();renderHeader();
  toast(`Bill #${seq} saved · ${rs(t)} ${mode}. Ready for next customer.`,3000);
  syncPending();
}

let sumDate=businessDate(new Date()),sumList=[],sumState="",sumErr="",sumSeq=0;
function shiftDate(s,d){const [y,m,dd]=s.split("-").map(Number);return ymd(new Date(y,m-1,dd+d));}
async function loadSummary(quiet){
  const seq=++sumSeq;
  if(!(me.admin||isManager()))sumDate=businessDate(new Date());     // workers: today only
  if(!fbReady()){sumState="nosheet";sumList=bills.filter(b=>b.bdate===sumDate);renderSummary();return;}
  if(!quiet||!sumList.length){sumState="loading";renderSummary();}
  syncPending();
  try{
    const [day,con,tot]=await Promise.all([getDoc("days/"+sumDate),me.admin?getDoc("contacts/"+sumDate).catch(()=>null):Promise.resolve(null),
      me.admin||isManager()?Promise.resolve(null):getDoc("dayTotals/"+sumDate).catch(()=>null)]);
    if(seq!==sumSeq)return;
    const m=(con&&con.m)||{};
    sumList=((day&&day.bills)||[]).map(b=>Object.assign({},b,{mobile:me.admin?(m[b.id]||(b.hasMobile?"••••••"+b.m4:"")):(b.hasMobile?"••••••"+b.m4:"")}));
    // bills made on this phone and not uploaded yet still count
    const have=new Set(sumList.map(b=>b.id));bills.filter(b=>b.bdate===sumDate&&!have.has(b.id)).forEach(b=>sumList.push(Object.assign({},billPublic(b),{mobile:b.mobile})));
    sumTotalToday=tot?Object.values(tot.t||{}).reduce((a,x)=>a+(Number(x)||0),0):null;
    sumState="ok";
  }catch(e){if(seq!==sumSeq)return;sumState=navigator.onLine?"error":"offline";sumErr=e.message||"Could not reach Firebase";}
  renderSummary();
}
let sumTotalToday=null;
function targetPush(s){
  const slabs=(me.slabs||[]).map(x=>[Number(x[0]),Number(x[1])]).filter(x=>x[0]>0).sort((a,b)=>a[0]-b[0]);
  if(me.admin||!slabs.length||sumDate!==businessDate(new Date()))return "";
  const t=s.total,next=slabs.find(x=>t<x[0]);
  if(!next){const top=slabs[slabs.length-1];return `<div class="status" style="margin:0 0 12px">🎯 Top target reached today: ${rs(top[0])}. Well done!</div>`;}
  return `<div class="status" style="margin:0 0 12px">🎯 <b>${rs(next[0]-t)}</b> more to reach today's ${rs(next[0])} target</div>`;
}

function summarize(all){
  const list=all.filter(b=>b.status!=="Voided"),voided=all.filter(b=>b.status==="Voided");
  const sum=arr=>arr.reduce((a,b)=>a+Number(b.total||0),0);
  const upi=list.filter(b=>b.mode==="UPI"),cash=list.filter(b=>b.mode==="Cash");
  const ev=list.filter(b=>b.menu==="evening"),nt=list.filter(b=>b.menu==="night");
  const add=(o,k,v)=>{o[k]=(o[k]||0)+v;};
  const filling={},dish={},burgers={},sandwiches={},rolls={},prod={},staff={};
  const plates={momos:0,burgers:0,sandwiches:0,rolls:0,pao:0,fries:0,nachos:0,drinks:0};
  let free=0;
  list.forEach(b=>{
    const who=b.staff||"Not set";staff[who]=staff[who]||{n:0,t:0};staff[who].n++;staff[who].t+=Number(b.total||0);
    (b.lines||[]).forEach(l=>{
      const c=catOf(l),p=platesOf(l);
      if(l.size==="FREE")free+=l.qty;
      add(prod,l.item+(l.opt?" – "+l.opt:""),p);
      if(c==="momos"){plates.momos+=p;add(filling,l.opt||"Other",p);add(dish,l.item,p);}
      else if(c==="burgers"){plates.burgers+=p;add(burgers,l.item+(l.opt?" – "+l.opt:""),p);}
      else if(c==="sandwiches"){plates.sandwiches+=p;add(sandwiches,l.item,p);}
      else if(c==="rolls"){if(l.item==="Pao Bhaji")plates.pao+=p;else{plates.rolls+=p;add(rolls,l.item,p);}}
      else if(c in plates)plates[c]+=p;
    });
  });
  const sorted=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const total=sum(list);
  return {all,list,voided,voidedTotal:sum(voided),total,upi:sum(upi),upiN:upi.length,cash:sum(cash),cashN:cash.length,
    ev:sum(ev),evN:ev.length,nt:sum(nt),ntN:nt.length,avg:list.length?Math.round(total/list.length):0,most:sorted(prod)[0],
    plates,free,rewards:list.filter(b=>b.reward).length,staff:Object.entries(staff).sort((a,b)=>b[1].t-a[1].t),
    filling:sorted(filling),dish:sorted(dish),burgers:sorted(burgers),sandwiches:sorted(sandwiches),rolls:sorted(rolls),
    withMobile:list.filter(b=>b.mobile).length};
}

  $("sumBody").innerHTML=head+body+`

      <button class="act" id="backupBtn">Back up this device's data</button>

    </div>`;
  if($("dPrev"))$("dPrev").onclick=()=>{sumDate=shiftDate(sumDate,-1);sumList=[];loadSummary();};
  if($("dNext"))$("dNext").onclick=()=>{if(sumDate<today){sumDate=shiftDate(sumDate,1);sumList=[];loadSummary();}};
  if($("syncNow"))$("syncNow").onclick=async()=>{toast("Sending…");await syncPending();toast(lastSyncError?"Not sent: "+lastSyncError:"Sent");loadSummary();};
  if($("retrySum"))$("retrySum").onclick=loadSummary;
  if($("shareSum"))$("shareSum").onclick=()=>shareSummary(summarize(sumList));
  if($("csvBtn"))$("csvBtn").onclick=()=>downloadCSV(sumList);
  $("backupBtn").onclick=backup;
  $("restoreBtn").onclick=()=>$("restoreFile").click();
  if($("settingsBtn"))$("settingsBtn").onclick=openOwner;
}

/* =========================================================
   SHIFT RULES (same maths as before, now per location)
   ========================================================= */
const hmM=t=>{const p=String(t).split(":");return (+p[0])*60+(+p[1]||0);};
const toMinL=t=>{const [d,c]=String(t).split(" "),[y,m,dd]=d.split("-").map(Number),[h,mi]=(c||"0:0").split(":").map(Number);return Date.UTC(y,m-1,dd,h,mi)/60000;};
const fromMinL=m=>{const s=new Date(m*60000).toISOString();return s.slice(0,10)+" "+s.slice(11,16);};
const dayMinL=date=>{const [y,m,d]=date.split("-").map(Number);return Date.UTC(y,m-1,d)/60000;};
function clockL(date,t,loc){const m=hmM(t);return dayMinL(date)+(locCfg(loc).day==="noon"&&m<12*60?1440:0)+m;}
function evalDay(date,loc,punches,edit){
  const L=locCfg(loc),len=+L.minutes||720,start=dayMinL(date)+hmM(L.start),end=start+len,grace=+L.grace||0;
  const ins=punches.filter(p=>p.type==="IN").map(p=>toMinL(p.time)),outs=punches.filter(p=>p.type==="OUT").map(p=>toMinL(p.time));
  let inM=ins.length?Math.min(...ins):null,outM=null;
  if(outs.length){const o=Math.max(...outs);if(inM===null||o>inM)outM=o;}
  let present=inM!==null;const flags={};
  const others=punches.filter(p=>p.other);if(others.length)flags.proxy=Array.from(new Set(others.map(p=>p.byName||"someone"))).join(", ");
  if(edit){
    if(edit.inT==="NONE")inM=null;else if(edit.inT)inM=clockL(date,edit.inT,loc);
    if(edit.outT==="NONE")outM=null;else if(edit.outT)outM=clockL(date,edit.outT,loc);
    present=edit.status==="Present"?true:edit.status==="Absent"?false:inM!==null;
    flags.edited=edit.reason||"Edited";
  }
  const rules=L.late!==false;            // kitchen: times recorded, no late or early deductions
  let late=present&&rules&&inM!==null&&inM>start+grace?inM-start:0;
  let early=present&&rules&&outM!==null&&outM<end?end-outM:0;
  if(late+early>len)early=Math.max(0,len-late);
  if(present&&outM===null)flags.missedOut=true;
  if(!present&&!ins.length&&outs.length)flags.missedIn=true;
  return {date,present,inT:inM===null?"":fromMinL(inM),outT:outM===null?"":fromMinL(outM),late,early,flags};
}
async function getDoc(path){const s=await withTimeoutP(D(path).get(),20000);return s.exists?s.data():null;}
async function staffMonth(st,month){
  const [a,e]=await Promise.all([getDoc(`att/${st.id}_${month}`),getDoc(`attEdits/${st.id}_${month}`)]);
  return {days:(a&&a.days)||{},edits:(e&&e.days)||{}};
}
function monthDays(month){const [y,m]=month.split("-").map(Number),n=new Date(y,m,0).getDate(),o=[];for(let i=1;i<=n;i++)o.push(month+"-"+pad(i));return o;}
// one person's month, day by day (only days already finished, plus today if present)
function dayRows(st,month,data,bandMap,slabs){
  const loc=st.loc||"outlet",today=dayFor(loc,new Date()),rows=[];let run=0;
  monthDays(month).forEach(d=>{
    if((st.joined&&d<st.joined)||(st.left&&d>st.left)||d>today||(cfg.trackFrom&&d<cfg.trackFrom))return;
    const r=evalDay(d,loc,((data.days[d]||{}).p)||[],data.edits[d]);
    if(d===today&&!r.present)return;
    run+=r.late;r.runLate=run;
    let inc=0;const lvl=bandMap?Number(bandMap[d]||0):0;
    if(r.present&&lvl)(slabs||[]).forEach(x=>{if(lvl>=Number(x[0]))inc=Math.max(inc,Number(x[1]));});
    r.incentive=inc;rows.push(r);
  });
  return rows;
}

let stockDraft={},stockWeekData={},stockErr="",stockDraftKey="";
const skey=(s,i)=>s+"|"+i;
const stockLoc=()=>curView==="kitchen"?"kitchen":"outlet";
const stockList=loc=>((cfg.stockLists||{})[loc||stockLoc()])||[];
function openStock(){renderStock();loadStockWeek();}
function weekDates(){const o=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);o.push(ymd(d));}return o;}
async function loadStockWeek(loc){
  loc=loc||stockLoc();
  if(!fbReady()){renderStock();return;}
  try{
    const ds=weekDates(),docs=await Promise.all(ds.map(d=>getDoc(`stock/${loc}_${d}`).catch(()=>null))),counts={};
    ds.forEach((d,i)=>{const list=(docs[i]&&docs[i].counts)||[];if(list.length){const last=list.slice().sort((a,b)=>a.time<b.time?-1:1).pop();counts[d]=last;}});
    stockWeekData[loc]=counts;stockErr="";
  }catch(e){stockErr=navigator.onLine?e.message:"";}
  if(loc===stockLoc())renderStock();
  return stockWeekData[loc];
}
function stockCounts(loc){return stockWeekData[loc||stockLoc()]||{};}
function renderStock(){
  const v=$("stockView"),td=ymd(new Date()),loc=stockLoc();if(!v)return;
  if(stockDraftKey!==loc+td){stockDraft={};stockDraftKey=loc+td;}
  const counts=stockCounts(loc),todays=counts[td];
  const prevDate=Object.keys(counts).filter(d=>d<td).sort().pop(),prev=prevDate?counts[prevDate]:null;
  if(todays&&!Object.keys(stockDraft).length)Object.assign(stockDraft,todays.values);
  let h=`<div class="att-card" style="text-align:left"><div class="state" style="font-size:22px">Morning stock count · ${loc==="kitchen"?"🍳 Kitchen":"🏪 Outlet"}</div>

  if(stockErr)h+=`<div class="status bad">${esc(stockErr)}</div>`;
  h+=stockList(loc).map(sec=>`<div class="st-sec"><h3>${esc(sec.name)}${sec.type==="yesno"?' <span class="m" style="font-weight:700">Chahiye? ✔/✘</span>':""}</h3>${sec.items.map(it=>{
    const k=skey(sec.name,it),val=stockDraft[k]===undefined?"":stockDraft[k],last=prev&&prev.values[k]!==undefined?prev.values[k]:"";
    const lastTxt=last!==""?`<small>Last: ${esc(sec.type==="yesno"?(last==="Yes"?"✔":"✘"):last)}</small>`:"";
    return sec.type==="yesno"
      ?`<div class="st-row"><div class="nm">${esc(it)}${lastTxt}</div><div class="yn"><button class="y${val==="Yes"?" on":""}" data-yn="${esc(k)}" data-v="Yes" aria-label="Needed">✔</button><button class="n${val==="No"?" on":""}" data-yn="${esc(k)}" data-v="No" aria-label="Not needed">✘</button></div></div>`
      :`<div class="st-row"><div class="nm">${esc(it)}${lastTxt}</div><div class="st-step"><button data-step="${esc(k)}" data-d="-0.5" aria-label="Less">−</button><input data-sk="${esc(k)}" inputmode="decimal" value="${esc(val)}" aria-label="${esc(it)}"><button data-step="${esc(k)}" data-d="0.5" aria-label="More">+</button></div></div>`;

async function saveStock(){

  if(!navigator.onLine){ask({title:"No internet",text:"Saving the stock count needs internet. Your numbers stay on screen; try again when online.",yes:"OK",no:null});return;}
  const b=$("stSave");b.disabled=true;b.textContent="Saving…";
  const count={id:"S"+device+now.getTime(),time:localStamp(now).slice(11),by:me.admin?"Owner":me.name,byId:me.staffId||"admin",values};
  try{
    await withTimeoutP(D(`stock/${loc}_${td}`).set({loc,date:td,counts:FV().arrayUnion(count)},{merge:true}),20000);
    mirror(loc==="kitchen"?"kstock":"stock",Object.keys(values).map(k=>{const sp=k.split("|");return [count.id,td,count.time,count.by,device,sp[0],sp.slice(1).join("|"),String(values[k])];}));
    (stockWeekData[loc]=stockWeekData[loc]||{})[td]=count;
    toast("Stock count saved");renderStock();

  }catch(e){ask({title:"Not saved",text:e.message||"Could not reach Firebase",yes:"OK",no:null});}
  finally{const bb=$("stSave");if(bb){bb.disabled=false;bb.textContent="Save count";}}
}
function stockText(){
  const td=ymd(new Date()),loc=stockLoc(),who=me.admin?"":me.name;
  let t=`*${cfg.shop} – ${loc==="kitchen"?"Kitchen":"Outlet"} stock ${fmtDate(td)}*`+(who?`\nCounted by ${who}`:"")+"\n";
  const need=[];
  stockList(loc).forEach(sec=>{
    if(sec.type==="yesno"){sec.items.forEach(it=>{if(stockDraft[skey(sec.name,it)]==="Yes")need.push(it);});return;}
    const rows=sec.items.filter(it=>(stockDraft[skey(sec.name,it)]||"")!=="").map(it=>`${it}: ${stockDraft[skey(sec.name,it)]}`);

let ownTab="sales",ownCache={},syncJobs=0;
const ADMIN_TABS=[["sales","📊 Sales"],["targets","🎯 Targets"],["insights","📈 Insights"],["staff","👥 Staff"],["attendance","🕒 Attendance"],["advances","💵 Advances"],["payroll","🧮 Salary"],["meals","🍽 Meals"],["stocklist","📦 Stock"],["b2badm","🧾 B2B"],["winback","💬 Win-back"],["settings","⚙ Settings"]];
const MANAGER_TABS=[["sales","📊 Sales"],["targets","🎯 Targets"],["insights","📈 Insights"],["staff","👥 Staff"],["attendance","🕒 Attendance"],["advances","💵 Advances"],["meals","🍽 Meals"],["stocklist","📦 Stock"],["b2badm","🧾 B2B"]];
const RO=()=>!me.admin;   // manager: read-only
const clone=o=>JSON.parse(JSON.stringify(o));
const monthName=m=>{const [y,mo]=m.split("-").map(Number);return new Date(y,mo-1,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"});};
const shiftMonth=(m,n)=>{let [y,mo]=m.split("-").map(Number);mo+=n;while(mo<1){mo+=12;y--;}while(mo>12){mo-=12;y++;}return y+"-"+pad(mo);};
const curMonth=()=>monthOf(ymd(new Date()));
function setSync(d){syncJobs=Math.max(0,syncJobs+d);$("ownSync").classList.toggle("hidden",!syncJobs);}
const ownBusy=t=>{$("ownBody").innerHTML=`<div class="loading">${t||"Loading…"}</div>`;};
function ownErr(e,retry){$("ownBody").innerHTML=`<div class="status bad">${esc(e.message||e)}<button class="act" id="ownRetry">Try again</button></div>`;$("ownRetry").onclick=retry;}
async function cached(key,fetcher,draw,retry){
  const tab=ownTab,still=()=>ownTab===tab&&isOpen("ownLayer");
  if(ownCache[key])draw(ownCache[key]);else ownBusy();
  setSync(1);
  try{const d=await fetcher();ownCache[key]=d;if(still())draw(d);}
  catch(e){if(!still())return;if(!ownCache[key])ownErr(e,retry);else toast("Couldn't refresh: "+e.message,3000);}
  finally{setSync(-1);}
}
function bgSave(job,undo,after){
  setSync(1);
  job().then(()=>{if(after)after();}).catch(e=>{if(undo)undo();toast("Not saved: "+(e.message||"no connection")+". Change undone.",4500);}).finally(()=>setSync(-1));

/* ---------- shared data ---------- */
async function monthTotals(month){   // final daily sales: the owner's actual figure where entered, otherwise billed
  const today=businessDate(new Date()),days=monthDays(month).filter(d=>d<=today);
  const [docs,act]=await Promise.all([Promise.all(days.map(d=>getDoc("dayTotals/"+d).catch(()=>null))),getDoc("sales/"+month).catch(()=>null)]);
  const billed={},actual=(act&&act.actual)||{},fin={};
  days.forEach((d,i)=>{billed[d]=Object.values((docs[i]&&docs[i].t)||{}).reduce((a,x)=>a+(Number(x)||0),0);
    fin[d]=actual[d]!==undefined&&actual[d]!==null?Number(actual[d]):billed[d];});
  return {days,billed,actual,fin};
}
async function payDocs(){const list=cfg.staffList||[],docs=await Promise.all(list.map(s=>getDoc("pay/"+s.id).catch(()=>null)));const o={};list.forEach((s,i)=>{o[s.id]=docs[i]||{};});return o;}
function ladderFrom(pays){const s=new Set();Object.values(pays).forEach(p=>(p.slabs||[]).forEach(x=>{if(Number(x[0])>0)s.add(Number(x[0]));}));return Array.from(s).sort((a,b)=>a-b);}

/* ---------- salary engine (rules unchanged; kitchen has no late/early cuts) ---------- */
async function computePayroll(month){
  const [pays,tot,lock,advQ]=await Promise.all([payDocs(),monthTotals(month),getDoc("payroll/"+month).catch(()=>null),
    withTimeoutP(db.collection("advances").where("month","==",month).get(),20000)]);
  const adv=advQ.docs.map(d=>Object.assign({id:d.id},d.data())).filter(a=>a.status!=="Cancelled");
  const staff=(cfg.staffList||[]),datas=await Promise.all(staff.map(st=>staffMonth(st,month)));
  const dim=monthDays(month).length,rows=[];
  staff.forEach((st,i)=>{
    const p=pays[st.id]||{},loc=st.loc||"outlet",L=locCfg(loc),today=dayFor(loc,new Date());
    const salary=Number(p.salary)||0,dayRate=salary/30,minRate=dayRate/(+L.minutes||720);
    const slabs=loc==="outlet"?(p.slabs||[]).map(x=>[Number(x[0]),Number(x[1])]).filter(x=>x[0]>0).sort((a,b)=>a[0]-b[0]):[];
    let employed=0,counted=0,present=0,late=0,early=0,incentives=0;const days=[];
    monthDays(month).forEach(d=>{
      if((st.joined&&d<st.joined)||(st.left&&d>st.left))return;
      employed++;
      if(d>today)return;
      const untracked=cfg.trackFrom&&d<cfg.trackFrom;
      const r=untracked?{date:d,present:true,inT:"",outT:"",late:0,early:0,flags:{untracked:true}}:evalDay(d,loc,((datas[i].days[d]||{}).p)||[],datas[i].edits[d]);
      if(d===today&&!r.present)return;
      counted++;let inc=0;
      if(r.present){present++;late+=r.late;early+=r.early;if(!untracked)slabs.forEach(x=>{if((tot.fin[d]||0)>=x[0])inc=x[1];});incentives+=inc;}
      r.sales=tot.fin[d]||0;r.incentive=inc;days.push(r);
    });
    if(!employed&&st.active===false)return;
    const lastDay=monthDays(month).pop(),complete=lastDay<today;
    const absent=counted-present,earned=Math.min(4,Math.floor(present/6)),paidLeave=Math.min(absent,earned),unpaid=absent-paidLeave;
    const unused=complete?Math.max(0,earned-absent):0,extra=unused*dayRate;     // worked on earned leave days: paid extra, shown only on the slip
    const fullMonth=employed===dim;
    const base=complete?(fullMonth?salary-unpaid*dayRate:Math.min(salary,(employed-unpaid)*dayRate)):Math.min(salary,(present+paidLeave)*dayRate);
    const timeCut=(late+early)*minRate,myAdv=adv.filter(a=>a.staffId===st.id),advTotal=myAdv.reduce((a,x)=>a+Number(x.amount||0),0);
    const absenceCut=complete?(fullMonth?unpaid*dayRate:salary-base):salary-base;
    const row={staffId:st.id,worker:st.name,loc,salary,daysInMonth:dim,employed,counted,present,leavesEarned:earned,paidLeaves:paidLeave,unpaid,unused,
      late,early,absenceCut:Math.round(absenceCut*100)/100,timeCut:Math.round(timeCut*100)/100,incentives,extra:Math.round(extra*100)/100,advances:advTotal,
      earned:Math.round(base-timeCut+incentives),net:Math.round(base-timeCut+incentives+extra-advTotal),complete,days,advanceList:myAdv,mobile:p.mobile||""};
    const L2=lock&&lock.locked&&(lock.rows||[]).find(r=>r.staffId===st.id||r.worker===st.name);
    if(L2)Object.assign(row,{locked:true,net:L2.net,advances:L2.advances,incentives:L2.incentives,timeCut:L2.timeCut,absenceCut:L2.absenceCut,extra:L2.extra||0});
    rows.push(row);
  });
  const lastDay=monthDays(month).pop();
  return {month,locked:!!(lock&&lock.locked),complete:lastDay<businessDate(new Date()),rows};
}

function drawTargets(month,d){

    :`<div class="list"><div class="empty">No days yet</div></div>`);

const dShort=s=>{const x=new Date(s+"T12:00:00");return x.getDate()+" "+x.toLocaleDateString("en-IN",{month:"short"});};
function slipText(d,r){
  const done=r.complete||r.locked,outlet=r.loc!=="kitchen";
  const lates=r.days.filter(x=>x.present&&x.late).map(x=>`${dShort(x.date)} (${x.late} min)`);
  const earlies=r.days.filter(x=>x.present&&x.early).map(x=>`${dShort(x.date)} (${x.early} min)`);
  const absents=r.days.filter(x=>!x.present).map(x=>dShort(x.date));
  const incs=r.days.filter(x=>x.incentive).map(x=>`${dShort(x.date)} ${rs(x.incentive)}`);
  const advs=(r.advanceList||[]).map(a=>`${dShort(a.date)} ${rs(a.amount)}`);
  let t=`*${cfg.shop} – Salary slip*\n*${r.worker}* · ${monthName(d.month)}\n`;
  t+=done?`Period: 1–${r.daysInMonth} ${new Date(d.month+"-01T12:00:00").toLocaleDateString("en-IN",{month:"short",year:"numeric"})}\n${r.locked?"Status: Paid":"Payment date: "+fmtDate(shiftMonth(d.month,1)+"-07")}\n`:`*Statement till ${fmtDate(ymd(new Date()))}* (month in progress)\n`;
  t+=`\n*Attendance*\nDays present: ${r.present}${done?` of ${r.employed}`:` of ${r.counted} so far`}\nLeaves taken: ${r.paidLeaves+r.unpaid} (paid ${r.paidLeaves}, unpaid ${r.unpaid})\n`;
  if(absents.length)t+=`Absent on: ${absents.join(", ")}\n`;
  if(outlet){t+=`Late: ${r.late} min${lates.length?" – "+lates.join(", "):""}\nLeft early: ${r.early} min${earlies.length?" – "+earlies.join(", "):""}\n`;}
  t+=`\n*Earnings*\n`+(done?`Monthly salary: ${rs(r.salary)}\n`:`Earned for ${r.present+r.paidLeaves} day${r.present+r.paidLeaves===1?"":"s"}: ${rs(Math.round(r.salary-r.absenceCut))}\n`);
  if(outlet)t+=`Incentives: ${rs(r.incentives)}${incs.length?" – "+incs.join(", "):""}\n`;
  if(done&&r.extra)t+=`Worked on leave days (${r.unused}): ${rs(Math.round(r.extra))}\n`;
  t+=`\n*Deductions*\n`+(done?`Unpaid days (${r.unpaid}): ${rs(Math.round(r.absenceCut))}\n`:"")+
     (outlet?`Late / early (${r.late+r.early} min): ${rs(Math.round(r.timeCut))}\n`:"")+`Advances: ${rs(r.advances)}${advs.length?" – "+advs.join(", "):""}\n`;
  return t+`\n*Net pay: ${rs(r.net)}*`;
}
function sendSlip(d,r){

    if(!ok)return;if(navigator.share)navigator.share({text:txt}).catch(()=>{});else window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");});

async function monthInsights(m){

  const all=[];docs.forEach(x=>((x&&x.bills)||[]).forEach(b=>all.push(b)));
  const seen=new Set(),bills=all.filter(b=>{if(seen.has(b.id))return false;seen.add(b.id);return true;});
  const ok=bills.filter(b=>b.status!=="Voided"),voided=bills.filter(b=>b.status==="Voided");
  const sum=a=>a.reduce((s,b)=>s+Number(b.total||0),0),total=sum(ok);

  const salesDays=Object.keys(perDay),best=salesDays.sort((x,y)=>perDay[y]-perDay[x])[0],worst=salesDays.slice().sort((x,y)=>perDay[x]-perDay[y])[0];
  const wd=[0,0,0,0,0,0,0],wdn=[0,0,0,0,0,0,0];Object.keys(perDay).forEach(d=>{const w=new Date(d+"T12:00:00").getDay();wd[w]+=perDay[d];wdn[w]++;});
  const add=(o,k,v)=>{o[k]=(o[k]||0)+v;};
  const items={},rev={},cats={},fill={},hours={},staff={},pairs={};let half=0,full=0,veg=0,nonveg=0,free=0;
  ok.forEach(b=>{
    add(staff,b.staff||"Not set",Number(b.total||0));
    const h=+String(b.local).slice(11,13);if(!isNaN(h))add(hours,h,1);
    const dishes=Array.from(new Set((b.lines||[]).filter(l=>!l.free).map(l=>l.item)));
    for(let i=0;i<dishes.length;i++)for(let j=i+1;j<dishes.length;j++){const k=[dishes[i],dishes[j]].sort().join(" + ");add(pairs,k,1);}
    (b.lines||[]).forEach(l=>{
      if(l.free){free+=l.qty;return;}
      const k=l.item+(l.opt?" – "+l.opt:""),amt=l.price*l.qty;
      add(items,k,platesOf(l));add(rev,k,amt);add(cats,catOf(l),amt);
      if(catOf(l)==="momos"){add(fill,l.opt||"Other",platesOf(l));if(l.size==="Half")half+=l.qty;else full+=l.qty;}
      if(isVeg(l))veg+=amt;else nonveg+=amt;

  });
  const sorted=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const withMob=ok.filter(b=>b.hasMobile||b.mobile),newC=withMob.filter(b=>Number(b.visit)===1).length,ret=withMob.filter(b=>Number(b.visit)>1).length;
  const top={};if(me.admin){const m2={};cons.forEach(c=>Object.assign(m2,(c&&c.m)||{}));ok.forEach(b=>{const n=m2[b.id];if(n){top[n]=top[n]||{n:0,t:0};top[n].n++;top[n].t+=Number(b.total||0);}});}
  const mojito=(PREF["d1||"]&&PREF["d1||"].price[0])||70,mealsVal=((meals&&meals.list)||[]).reduce((a,x)=>a+Number(x.value||0),0);
  const b2bBills=(b2b&&b2b.bills)||[],b2bItems={},b2bBuyer={};
  b2bBills.forEach(x=>{add(b2bBuyer,x.buyer,Number(x.total||0));(x.lines||[]).forEach(l=>add(b2bItems,l.name,l.packs));});
  const finalTotal=tot.days.reduce((a,d)=>a+tot.fin[d],0);
  return {m,days:days.length,total,finalTotal,bills:ok.length,avg:ok.length?Math.round(total/ok.length):0,perDayAvg:salesDays.length?Math.round(total/salesDays.length):0,

    head=d.headers;rows=rows.concat(d.rows);off=d.next;if(msg)msg(`Reading ${tab.toLowerCase()} from the Sheet… ${rows.length} of ${d.total}`);}while(off!==null&&off!==undefined);

}

    const c=pr.config||{},ladder=ladderFrom(pays);
    const L=Object.assign({},cfg.locations);L.outlet=Object.assign({},locCfg("outlet"),c.shopLat!=null?{lat:c.shopLat,lng:c.shopLng}:{},
      c.radius?{radius:c.radius}:{},c.shiftStart?{start:c.shiftStart}:{},c.grace!=null?{grace:c.grace}:{},c.shiftMinutes?{minutes:c.shiftMinutes}:{});
    await saveShared({shop:c.shop||cfg.shop,upi:c.upi||cfg.upi,payee:c.payee||cfg.payee,ownerWa:c.ownerWa||"",kitchenWa:c.kitchenWa||"",
      rewardEvery:c.rewardEvery!=null?c.rewardEvery:3,rewardMin:c.rewardMin!=null?c.rewardMin:300,billMsg:c.billMsg||cfg.billMsg,prices:c.prices||{},
      stockLists:Object.assign({},cfg.stockLists,{outlet:c.stockList||cfg.stockLists.outlet},(cfg.stockLists&&cfg.stockLists.kitchen)?{}:{kitchen:c.stockList||DEFAULT_STOCK}),
      locations:L,staffList:list,ladder,payrollStart:pr.payrollStart||""});
  }
  // bills → day documents, totals, customer numbers, visit counts
  const B=(await sheetDump(pin,"BILLS",msg)).filter(r=>!since||sTxt(r["Business date"])>=since);
  const byDay={};B.forEach(r=>{const d=sTxt(r["Business date"]);(byDay[d]=byDay[d]||[]).push(r);});
  const dayKeys=Object.keys(byDay).sort();let n=0;
  await inChunks(dayKeys,4,async d=>{
    const ex=(await getDoc("days/"+d))||{},map={};(ex.bills||[]).forEach(b=>{map[b.id]=b;});
    const t={},m={},cust={};
    byDay[d].forEach(r=>{
      let lines=[];try{lines=JSON.parse(r["Lines (data)"]||"[]");}catch(e){}
      const mob=sTxt(r["Mobile"]).replace(/\D/g,""),id=sTxt(r["Bill ID"]),status=sTxt(r["Status"]);
      const b={id,seq:+id.split("-").pop()||0,device:sTxt(r["Device"]),local:sTxt(r["Date & time"]),bdate:d,menu:r["Menu"]==="Night"?"night":"evening",staff:sTxt(r["Staff"]),
        lines,count:Number(r["Item count"])||0,total:Number(r["Total (₹)"])||0,mode:sTxt(r["Payment"]),mobile:mob,visit:Number(r["Visit no."])||0,reward:r["Free Mojito"]==="Yes",status,voidReason:sTxt(r["Void reason"])};
      map[id]=Object.assign({},billPublic(b),{staffId:idOf(b.staff)});
      t[id]=status==="Voided"?0:b.total;
      if(validMobile(mob)){m[id]=mob;if(status!=="Voided")(cust[mob]=cust[mob]||{})[id]=d;}
    });
    const until=untilFor(d);
    await D("days/"+d).set({bills:Object.values(map).sort((a,b)=>a.local<b.local?-1:1),until},{merge:true});
    await D("dayTotals/"+d).set({t,until},{merge:true});
    if(Object.keys(m).length)await D("contacts/"+d).set({m,until},{merge:true});
    await inChunks(Object.keys(cust),10,mob=>D("customers/"+mob).set({bills:cust[mob]},{merge:true}));
    n++;msg(`Copying bills… ${n} of ${dayKeys.length} days`);
  });
  // attendance and corrections
  const A=(await sheetDump(pin,"ATT",msg)).filter(r=>(!since||sTxt(r["Business date"])>=since)&&String(r["Clock check"]||"").indexOf("Rejected")!==0);
  const att={};A.forEach(r=>{const id=idOf(r["Worker"]);if(!id)return;const d=sTxt(r["Business date"]),k=id+"_"+monthOf(d);
    ((att[k]=att[k]||{})[d]=att[k][d]||[]).push({id:sTxt(r["Punch ID"]),type:sTxt(r["Type"]),time:sTxt(r["Time"]),device:sTxt(r["Phone code"]),by:"",byName:sTxt(r["Phone of"]),
      other:r["For someone else"]==="Yes",lat:r["Latitude"]===""?null:Number(r["Latitude"]),lng:r["Longitude"]===""?null:Number(r["Longitude"]),acc:r["Accuracy (m)"]===""?null:Number(r["Accuracy (m)"]),dist:r["Distance (m)"]===""?null:Number(r["Distance (m)"])});});
  if(!recentDays&&!cfg.trackFrom&&A.length){const first=A.map(r=>sTxt(r["Business date"])).sort()[0];await saveShared({trackFrom:first});}
  msg("Copying attendance…");
  await inChunks(Object.keys(att),4,async k=>{
    const ex=(await getDoc("att/"+k))||{days:{}},days={};
    Object.keys(att[k]).forEach(d=>{const have=((ex.days&&ex.days[d]&&ex.days[d].p)||[]),ids=new Set(have.map(p=>p.id));days[d]={p:have.concat(att[k][d].filter(p=>!ids.has(p.id)))};});
    await D("att/"+k).set({staffId:k.split("_")[0],days},{merge:true});
  });
  const E=(await sheetDump(pin,"EDITS",msg)).filter(r=>!since||sTxt(r["Business date"])>=since),ed={};
  E.forEach(r=>{const id=idOf(r["Worker"]);if(!id)return;const d=sTxt(r["Business date"]),k=id+"_"+monthOf(d),e={status:sTxt(r["Status"]),inT:sTxt(r["Check-in"]),outT:sTxt(r["Check-out"]),reason:sTxt(r["Reason"]),at:sTxt(r["Edited at"]),by:"admin"};
    const cur=(ed[k]=ed[k]||{})[d];if(!cur||e.at>=cur.at)ed[k][d]=e;});
  await inChunks(Object.keys(ed),6,k=>D("attEdits/"+k).set({staffId:k.split("_")[0],days:ed[k]},{merge:true}));
  // advances
  msg("Copying advances…");
  const V=(await sheetDump(pin,"ADV",msg)).filter(r=>!since||sTxt(r["Date"])>=since);
  await inChunks(V,10,r=>{const id=sTxt(r["Advance ID"]);if(!id)return Promise.resolve();
    return D("advances/"+id).set({staffId:idOf(r["Worker"]),staffName:sTxt(r["Worker"]),date:sTxt(r["Date"]),amount:Number(r["Amount (₹)"])||0,by:sTxt(r["Added by"])||"Worker",
      note:sTxt(r["Note"]),month:sTxt(r["Settles in"])||settleMonthOf(sTxt(r["Date"])),status:sTxt(r["Status"])||"Active",reviewed:r["Reviewed"]==="Yes",at:sTxt(r["Changed at"])});});
  // staff meals
  const M=(await sheetDump(pin,"MEALS",msg)).filter(r=>!since||sTxt(r["Business date"])>=since),meals={};
  M.forEach(r=>{let lines=[];try{lines=JSON.parse(r["Lines (data)"]||"[]");}catch(e){}const d=sTxt(r["Business date"]);
    (meals[monthOf(d)]=meals[monthOf(d)]||[]).push({id:sTxt(r["Meal ID"]),bdate:d,local:sTxt(r["Date & time"]),employee:sTxt(r["Employee"]),employeeId:idOf(r["Employee"]),device:sTxt(r["Phone code"]),
      byName:sTxt(r["Phone of"]),other:r["For someone else"]==="Yes",lines,value:Number(r["Value (₹)"])||0});});
  await inChunks(Object.keys(meals),3,async mo=>{const ex=(await getDoc("meals/"+mo))||{},ids=new Set((ex.list||[]).map(x=>x.id));
    await D("meals/"+mo).set({list:(ex.list||[]).concat(meals[mo].filter(x=>!ids.has(x.id)))},{merge:true});});
  // stock counts (outlet)
  const K=(await sheetDump(pin,"STOCK",msg)).filter(r=>!since||sTxt(r["Date"])>=since),counts={};
  K.forEach(r=>{const d=sTxt(r["Date"]),id=sTxt(r["Count ID"]),dk=(counts[d]=counts[d]||{}),c=dk[id]||(dk[id]={id,time:sTxt(r["Time"]),by:sTxt(r["Counted by"]),byId:"",values:{}});c.values[sTxt(r["Section"])+"|"+sTxt(r["Item"])]=sTxt(r["Value"]);});
  await inChunks(Object.keys(counts),5,async d=>{const ex=(await getDoc("stock/outlet_"+d))||{},ids=new Set((ex.counts||[]).map(x=>x.id));
    await D("stock/outlet_"+d).set({loc:"outlet",date:d,counts:(ex.counts||[]).concat(Object.values(counts[d]).filter(x=>!ids.has(x.id)))},{merge:true});});
  // actual sales entered by the owner
  const Sx=(await sheetDump(pin,"SALES",msg)).filter(r=>!since||sTxt(r["Business date"])>=since),act={};
  Sx.forEach(r=>{const d=sTxt(r["Business date"]),v=r["Actual sales (₹)"];((act[monthOf(d)]=act[monthOf(d)]||{}))[d]=v===""||v===null?FV().delete():Number(v);});
  await inChunks(Object.keys(act),4,mo=>D("sales/"+mo).set({actual:act[mo]},{merge:true}));
  // paid (locked) salary months
  if(!recentDays){
    const P=await sheetDump(pin,"PAY",msg),byM={};
    P.forEach(r=>{const mo=sTxt(r["Month"]);(byM[mo]=byM[mo]||[]).push({staffId:idOf(r["Worker"]),worker:sTxt(r["Worker"]),salary:Number(r["Salary (₹)"])||0,present:Number(r["Present"])||0,
      paidLeaves:Number(r["Paid leaves"])||0,unpaid:Number(r["Unpaid days"])||0,late:Number(r["Late min"])||0,early:Number(r["Early min"])||0,absenceCut:Number(r["Absence cut (₹)"])||0,
      timeCut:Number(r["Time cut (₹)"])||0,incentives:Number(r["Incentives (₹)"])||0,extra:0,advances:Number(r["Advances (₹)"])||0,net:Number(r["Net pay (₹)"])||0});});
    await inChunks(Object.keys(byM).filter(mo=>(pr.locks||[]).indexOf(mo)>=0),4,mo=>D("payroll/"+mo).set({locked:true,lockedAt:"copied from Sheet",rows:byM[mo]}));
  }
  // target levels per day, for workers' incentive view
  msg("Working out target days…");
  const months=Array.from(new Set(dayKeys.map(monthOf))),ladder=(cfg.ladder||[]).slice().sort((a,b)=>a-b);
  if(ladder.length)await inChunks(months,2,async mo=>{const t=await monthTotals(mo),d={};t.days.forEach(x=>{let l=0;ladder.forEach(y=>{if(t.fin[x]>=y)l=y;});if(l)d[x]=l;});
    if(Object.keys(d).length)await D("bands/"+mo).set({d},{merge:true});});
  await D("meta/platform").set({copiedAt:localStamp(new Date())},{merge:true});
  ownCache={};
  msg(`✓ Copied: ${B.length} bills, ${A.length} attendance entries, ${V.length} advances, ${M.length} meals, ${Object.keys(counts).length} stock days.`,"ok");
}

async function catchUp(){
  if(!me.admin||platform.mode!=="firebase"||!platform.liveCopy||!local.sheetUrl||!navigator.onLine)return;
  try{
    const bd=businessDate(new Date()),d=await sheetGet({action:"day",date:bd,device},20000);if(!d.ok)return;
